1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"><\/path><\/svg><span>Account settings<\/span><\/a><\/div><button type=\"button\" class=\"ps-drawer-row ps-drawer-row--danger\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9\"><\/path><\/svg><span>Log out<\/span><\/button><\/nav><\/div><\/div>\n    \n  \n\n"},{"group":"Campaign flow","label":"3. About this campaign","path":"/campaigns/c12/about","landed":"/campaigns/c9","sheetIds":[0],"htmlAttrs":"lang=\"en\" data-theme=\"light\" style=\"--ps-dock-h: 73px;\"","bodyAttrs":"","body":"\n    <div id=\"root\"><div class=\"ps-shell\"><main class=\"ps-content\"><div class=\"ps-page\"><div class=\"ps-about-page\"><button type=\"button\" class=\"ps-cp-round ps-cp-back\" aria-label=\"Back to campaign\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M19 12H5M12 19l-7-7 7-7\"><\/path><\/svg><\/button><h1 class=\"ps-page-title\">About this campaign<\/h1><section class=\"ps-sheet-sec\"><h3>The message we want to deliver<\/h3><p class=\"ps-sheet-text\">Move. Burn. Earn.<\/p><\/section><section class=\"ps-sheet-sec\"><h3>Brief<\/h3><p class=\"ps-sheet-text\">Show a real moment from your life: your daily morning or afternoon walk or run to stay fit. That same routine now earns you credits you can spend on any medicine through Flash Health.<\/p><\/section><section class=\"ps-sheet-sec\"><h3>Required actions<\/h3><ul class=\"ps-rules ps-rules--bullets\"><li>Earn points on the Flash Health app just by walking or running.<\/li><li>Use those credits to buy pharmacy medicine and lab tests.<\/li><li>After the run, show the Flash Health app home screen: it remembers your medicine routine and your family’s, and reminds you to refill without any hiccups.<\/li><li>Show that you can get any medicine from the network of pharmacies connected to Flash Health, with no pharmacy queues, delivered to your doorstep.<\/li><\/ul><\/section><section class=\"ps-sheet-sec\"><h3>Requirements &amp; resources<\/h3><div class=\"ps-req-grid\"><div class=\"ps-req-cell\"><span>Format<\/span><b>Vertical 9:16<\/b><\/div><div class=\"ps-req-cell\"><span>Duration<\/span><b>40–60 seconds<\/b><\/div><div class=\"ps-req-cell\"><span>Hook<\/span><b>Spoken or on screen in the first 3 s<\/b><\/div><div class=\"ps-req-cell\"><span>Quality<\/span><b>Min 1080p<\/b><\/div><div class=\"ps-req-cell\"><span>Language<\/span><b>English, Sinhala or Singlish<\/b><\/div><div class=\"ps-req-cell\"><span>Captions<\/span><b>Required, bilingual welcome<\/b><\/div><div class=\"ps-req-cell ps-req-cell--wide\"><span>Brand visibility<\/span><b>Flash Health app (step counter and points screen) and the Flash Health medicine delivery package<\/b><\/div><div class=\"ps-req-cell ps-req-cell--wide\"><span>How to submit<\/span><b>Upload your video or photo first; once approved, post it and add the link<\/b><\/div><\/div><\/section><section class=\"ps-sheet-sec\"><h3>Platforms to post on<\/h3><div><span class=\"ps-platform-chip\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"var(--text-primary)\" style=\"display: block; flex-shrink: 0;\"><path d=\"M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zM7.6 4A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm5.5-3.8a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z\" fill-rule=\"evenodd\"><\/path><\/svg>Instagram<\/span><\/div><\/section><section class=\"ps-sheet-sec\"><h3>Call-to-action ideas<\/h3><blockquote class=\"ps-cta-quote\">“Download the Flash Health app now.”<\/blockquote><\/section><section class=\"ps-sheet-sec\"><h3>Restrictions<\/h3><ul class=\"ps-rules ps-rules--bullets\"><li>Show real step counts and points from your own app. Don’t fake or edit the numbers<\/li><li>Don’t promise a points rate or rewards beyond what the app shows<\/li><\/ul><\/div><\/div><\/main><div class=\"ps-dock\" data-tour=\"campaign-action\"><button class=\"ps-btn\" style=\"display: inline-flex; flex-direction: row; gap: 10px; padding: 8px 28px; min-height: 48px; max-width: 100%; justify-content: center; align-items: center; box-sizing: border-box; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; font-family: var(--font-sans); font-weight: 600; font-size: 15px; line-height: 20px; text-align: center; opacity: 1; box-shadow: var(--shadow-button); border-radius: var(--radius-pill); background-color: var(--brand-primary); color: var(--grey-50); width: 100%;\">Join campaign<\/button><\/div><\/div><div class=\"ps-drawer-scrim\" aria-hidden=\"true\"><\/div><nav class=\"ps-drawer\" id=\"ps-drawer\" aria-label=\"Main menu\" aria-hidden=\"true\" inert=\"\"><div class=\"ps-drawer-head\"><span>Menu<\/span><button type=\"button\" class=\"ps-float-btn\" aria-label=\"Close menu\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M18 6L6 18M6 6l12 12\"><\/path><\/svg><\/button><\/div><a aria-current=\"page\" class=\"ps-drawer-row active\" href=\"#\" data-discover=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z\"><\/path><\/svg><span>Campaigns<\/span><svg width=\"20\" height <script>
  const data = JSON.parse(document.getElementById('data').textContent);
  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  const groups = ['All', ...new Set(data.screens.map((s) => s.group))];
  const figures = data.screens.map((s) => {
    const fig = document.createElement('figure');
    fig.dataset.group = s.group;
    const css = s.sheetIds.map((i) => '<style>' + data.sheets[i] + '</style>').join('');
    const frame = document.createElement('iframe');
    frame.title = s.label;
    frame.setAttribute('sandbox', 'allow-same-origin');
    frame.srcdoc = '<!doctype html><html ' + s.htmlAttrs + '><head><meta charset="utf-8"><meta name="viewport" content="width=390">' + css +
      '</head><body ' + s.bodyAttrs + '>' + s.body + '</body></html>';
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.append(frame);
    const phone = document.createElement('div');
    phone.className = 'phone';
    phone.append(screen);
    const cap = document.createElement('figcaption');
    cap.innerHTML = '<strong></strong><code></code>';
    cap.querySelector('strong').textContent = s.label;
    cap.querySelector('code').textContent = s.path;
    fig.append(phone, cap);
    grid.append(fig);
    return fig;
  });
  for (const g of groups) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = g;
    b.setAttribute('aria-pressed', String(g === 'All'));
    b.addEventListener('click', () => {
      filters.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      figures.forEach((f) => { f.hidden = g !== 'All' && f.dataset.group !== g; });
    });
    filters.append(b);
  }
</script>
