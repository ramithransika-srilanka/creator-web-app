<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGC Platform — Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens — identical to the mobile prototype (from Figma).
     Desktop only adds layout: widths, columns and the top menu.
     ===================================================================== */
  :root{
    --grey-50:#fff; --grey-50-90:rgba(255,255,255,.9);
    --grey-100:#ececec; --grey-100-20:rgba(236,236,236,.2);
    --grey-200:#d9d9d9; --grey-400:#b3b3b3; --grey-500:#a0a0a0;
    --grey-600:#717171; --grey-700:#414141; --grey-800:#121212;
    --blue-100:#d0dafb; --blue-200:#a1b6f7; --blue-300:#7391f3; --blue-500:#1548eb; --blue-600:#123bbd; --blue-700:#0f2d8f;
    --pink-500:#f433ab;
    --font:'Inter',-apple-system,system-ui,sans-serif;

    /* status colours used by the mobile campaign pages */
    --ongoing:#07b11e; --pending:#e8890c; --pending-card:#a32dd2; --liked:#FF6B4A; --badge:#ffd22d; --badge-ongoing:#3be06a; --earn:#2e8b3d;

    /* desktop layout */
    --gutter:40px; --rail:361px; --page:1280px; --header:48px;
    /* The top bar keeps its own width so it never shifts when a page (e.g. body.wide) widens --page */
    --shell:1280px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* Reserve the scrollbar space on every page so short and long pages line up */
  html{scrollbar-gutter:stable;}
  body{background:var(--grey-50);color:var(--grey-800);font-family:var(--font);font-size:14px;line-height:20px;min-height:100dvh;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img{display:block;}
  svg{display:block;}

  /* Screen navigation transition — same signature as the mobile app */
  @keyframes screenIn{from{opacity:0;transform:translateY(22px) scale(.988);filter:blur(6px);}to{opacity:1;transform:none;filter:blur(0);}}
  .nav-in{animation:screenIn .46s cubic-bezier(.16,1,.3,1) both;}
  @media(prefers-reduced-motion:reduce){.nav-in{animation:none;}}

  /* ================= App shell: top menu ================= */
  .topbar{position:sticky;top:0;z-index:20;height:var(--header);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 max(var(--gutter),calc((100% - var(--shell)) / 2));
    background:var(--grey-50-90);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--grey-200);}
  .brand{grid-column:1;justify-self:start;display:flex;align-items:center;height:32px;color:var(--grey-800);border-radius:8px;transition:opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .brand svg{height:18px;width:auto;aspect-ratio:269/184;}
  .brand:hover{opacity:.8;}
  .brand:active{transform:scale(.96);}
  .tnav{grid-column:2;display:flex;align-items:center;gap:4px;}
  .tnav a{width:52px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-500);transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .tnav a svg{height:17px;width:auto;max-width:20px;}
  .tnav a:hover{background:var(--grey-100);color:var(--grey-700);}
  .tnav a.active{color:var(--grey-800);}
  .tnav a:active{transform:scale(.94);}
  .top-right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px;}
  .wallet-pill{display:flex;gap:6px;align-items:center;height:32px;background:var(--blue-500);padding:3px 12px 3px 3px;border-radius:100px;cursor:pointer;transition:background .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .wallet-pill:hover{background:var(--blue-600);}
  .wallet-pill:active{transform:scale(.97);}
  .wallet-pill img{width:26px;height:26px;border-radius:100px;border:1.5px solid var(--grey-50);object-fit:cover;}
  .wallet-pill span{font-size:14px;font-weight:600;line-height:20px;letter-spacing:-.01em;color:var(--grey-50);font-variant-numeric:tabular-nums;}
  .hicon{width:32px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-800);position:relative;background:#fff;border:1px solid var(--grey-200);transition:background .25s ease,border-color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .hicon:hover{background:var(--grey-100);}
  .hicon:active{transform:scale(.94);}
  .hicon.on{background:var(--grey-800);border-color:var(--grey-800);color:var(--grey-50);}
  .hicon svg{width:17px;height:17px;}
  .hicon .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .top-av{display:block;width:32px;height:32px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .top-av:active{transform:scale(.94);}

  .content{width:100%;max-width:calc(var(--page) + var(--gutter) * 2);margin:0 auto;padding:24px var(--gutter) 80px;}
  .phone-note{display:none;}

  /* ================= Shared (mobile components) ================= */
  .page-title{font-size:28px;font-weight:600;line-height:38px;color:#000;padding:4px 0 16px;}
  .h20{font-size:20px;font-weight:600;line-height:24px;color:var(--grey-800);}
  .h16{font-size:16px;font-weight:600;line-height:20px;color:#000;}
  .sub{font-size:14px;line-height:20px;color:var(--grey-600);}

  .tags{display:flex;gap:12px;flex-wrap:wrap;}
  .tag{flex-shrink:0;padding:8px 12px;border-radius:100px;background:var(--grey-100);font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);white-space:nowrap;cursor:pointer;transition:background .25s ease,color .25s ease;}
  .tag.active{background:var(--blue-200);}
  .tag.pop{animation:mwTagPop .36s cubic-bezier(.34,1.56,.64,1);}
  @keyframes mwTagPop{0%{transform:scale(.82);}55%{transform:scale(1.1);}100%{transform:scale(1);}}

  .sechead{display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .seeall{font-size:12px;font-weight:500;line-height:12px;color:var(--blue-600);cursor:pointer;}

  /* Buttons */
  .btn-primary{background:var(--blue-500);padding:12px 20px;border-radius:100px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 6px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-50);}
  .btn-secondary{background:var(--grey-200);border:2px solid var(--grey-200);padding:12px 20px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 6px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);}
  .btn-dark{background:var(--grey-800);border:2px solid var(--grey-800);padding:12px 20px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 6px rgba(0,0,0,.08);cursor:pointer;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-50);}
  .btn-questions{background:var(--blue-100);border:2px solid var(--blue-100);padding:12px 0;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 6px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--blue-700);}
  .view-btn,.mw-join{background:var(--grey-50);padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);box-shadow:2px 2px 12px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .btn-primary[disabled]{opacity:.6;pointer-events:none;}
  .iconbtn{display:flex;align-items:center;padding:4px;border-radius:20px;background:rgba(246,246,246,.5);cursor:pointer;color:#121212;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .iconbtn svg{width:24px;height:24px;}

  /* Heart like interaction */
  .like-heart{cursor:pointer;display:flex;}
  .like-heart svg{transition:transform .2s ease;}
  .like-heart.liked path{fill:var(--liked);}
  .like-heart.liked svg{animation:heartpop .3s ease;}
  @keyframes heartpop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}

  .logos{display:flex;}
  .logos img{width:20px;height:20px;border-radius:20px;object-fit:cover;margin-left:-8px;border:1.5px solid var(--grey-50);background:#fff;}
  .logos img:first-child{margin-left:0;}
  .chip-right{display:flex;gap:4px;align-items:center;}
  .chip-right img{width:20px;height:20px;border-radius:100px;object-fit:cover;background:#fff;}

  .progress{height:6px;border-radius:100px;background:#ddd;overflow:hidden;}
  .progress .fill{height:6px;background:var(--blue-500);border-radius:20px;}

  /* Key / value list (cp-list) */
  .cp-list{padding:16px;border-radius:12px;display:flex;flex-direction:column;gap:8px;width:100%;}
  .cp-list .row{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px;line-height:20px;}
  .cp-list .row .k{font-weight:500;color:var(--grey-600);}
  .cp-list .row .v{font-weight:600;color:var(--grey-800);text-align:right;white-space:nowrap;}
  .cp-list .div{height:1px;background:var(--grey-200);margin:4px 0;}
  .cp-list .social{display:flex;gap:8px;align-items:center;}
  .cp-list .social svg{width:16px;height:16px;color:var(--grey-800);}

  /* White card (creator card) */
  .wcard{background:#fff;border-radius:20px;filter:drop-shadow(2px 4px 2px rgba(0,0,0,.12));}

  /* Dark band with rounded grey sheets — the app's signature */
  .band{background:var(--grey-800);display:flex;flex-direction:column;}
  .band.pill{border-radius:100px;}
  .sheet-b{background:var(--grey-50);border-radius:0 0 28px 28px;}
  .sheet-t{background:var(--grey-50);border-radius:28px 28px 0 0;}

  /* Placeholder / empty state (.ph from mobile) */
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 32px;gap:12px;grid-column:1/-1;}
  .ph .tag2{background:var(--blue-100);color:var(--blue-700);font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;}
  .ph h2{font-size:24px;font-weight:600;color:var(--grey-800);line-height:32px;}
  .ph p{font-size:14px;line-height:20px;color:var(--grey-600);max-width:280px;}

  /* Skeleton while the feed loads */
  .sk{background:var(--grey-100);border-radius:12px;position:relative;overflow:hidden;}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.3s infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
  .sk-card{display:flex;flex-direction:column;gap:8px;padding:12px;}
  .sk-card .l1{margin-top:20px;}
  .sk-card .img{height:240px;border-radius:20px;}
  .sk-card .l1{height:20px;width:80%;margin:16px 16px 0;}
  .sk-card .l2{height:12px;width:40%;margin:0 16px;}
  .sk-card .l3{height:6px;margin:4px 16px 16px;border-radius:100px;}

  /* Staggered reveal on My work tag switch (mwRise from mobile) */
  @keyframes mwRise{0%{opacity:0;transform:perspective(900px) rotateX(-22deg) translateY(46px) scale(.94);filter:blur(7px);}55%{opacity:1;filter:blur(0);}100%{opacity:1;transform:perspective(900px) rotateX(0deg) translateY(0) scale(1);filter:blur(0);}}
  .mw-stagger{animation:mwRise .58s cubic-bezier(.2,.8,.24,1.12) both;transform-origin:center bottom;backface-visibility:hidden;}
  @keyframes mwPopIn{0%{opacity:0;transform:scale(.3);}60%{opacity:1;transform:scale(1.12);}100%{opacity:1;transform:scale(1);}}
  .mw-logo72.mw-stagger{animation:mwPopIn .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center;}

  /* ================= Campaign card (home feed) ================= */
  .cardwrap{padding:12px;}
  .card-img{position:relative;height:240px;border-radius:20px;overflow:hidden;box-shadow:0 2px 2px rgba(0,0,0,.16);cursor:pointer;background:var(--grey-200);}
  .card-img>.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card-logobar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px;}
  .card-logobar .logo{width:36px;height:36px;border-radius:100px;border:1px solid var(--grey-50);object-fit:cover;background:#fff;}
  .heart{width:24px;height:24px;color:#fff;}
  .heart path{fill:rgba(18,18,18,.6);}
  .overlaybar{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;}
  .overlaybar::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:20px;z-index:0;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
  .overlaybar>*{position:relative;z-index:1;}
  .details{display:flex;gap:6px;align-items:center;}
  .details svg{width:14px;height:14px;color:#fff;}
  .price-chip{background:var(--grey-100-20);padding:4px 8px;border-radius:20px;font-size:12px;font-weight:500;color:#fff;line-height:12px;}
  .pending-card{background:var(--pending-card);border-radius:20px;width:100%;display:flex;flex-direction:column;overflow:hidden;}
  .pending-card .heart path{fill:var(--liked);stroke:#fff;}
  .pending-earned{text-align:center;padding:6px 0;font-size:14px;font-weight:500;line-height:16px;color:var(--grey-50);}
  .card-content{display:flex;flex-direction:column;gap:8px;padding:16px;}
  .card-content .ctitle{font-size:16px;font-weight:600;line-height:20px;color:#000;cursor:pointer;}
  .card-time{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}
  .card-time .dot{width:2px;height:2px;border-radius:2px;background:var(--grey-600);}
  .progress-group{display:flex;flex-direction:column;gap:4px;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:normal;}
  .card-foot .joined{display:flex;gap:4px;align-items:center;font-weight:500;color:var(--grey-800);}
  .card-foot .joined svg{width:14px;height:14px;color:#131927;}
  .card-foot .money{display:flex;gap:4px;align-items:center;white-space:nowrap;color:var(--grey-800);font-weight:500;}
  .card-foot .money b{font-weight:600;color:var(--grey-800);}

  /* ================= Home: Campaigns ================= */
  .home{padding-top:16px;}
  .home-title{font-size:40px;font-weight:600;line-height:48px;letter-spacing:-.025em;color:#000;}
  /* Search reveals under the heading (toggled from the header search icon) */
  .home-search{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1),margin-top .45s cubic-bezier(.16,1,.3,1);}
  .home-search>div{overflow:hidden;min-height:0;}
  .home-search .search{opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1);}
  .home-search.open{grid-template-rows:1fr;margin-top:16px;}
  .home-search.open .search{opacity:1;transform:none;}
  .search{display:flex;align-items:center;gap:12px;height:48px;margin:1px;padding:0 20px;border:1px solid var(--grey-400);border-radius:100px;background:#fff;transition:border-color .2s ease;}
  .search:focus-within{border-color:var(--blue-300);}
  .search svg{width:22px;height:22px;color:var(--grey-800);flex-shrink:0;}
  .search input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font:500 14px var(--font);color:var(--grey-800);}
  .search input::placeholder{color:var(--grey-600);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search kbd{font:500 12px/12px var(--font);color:var(--grey-500);padding:4px 8px;border-radius:8px;background:var(--grey-100);}
  .home .tags{margin-top:24px;gap:8px;}
  .tag:active{transform:scale(.96);}

  .feedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:32px;}
  .feedgrid>.cardwrap,.feedgrid>.sk-card{background:#fff;border:1px solid var(--grey-200);border-radius:32px;}
  .feedgrid>.cardwrap{transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s cubic-bezier(.16,1,.3,1);animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 60ms);}
  .feedgrid>.cardwrap:hover{transform:translateY(-2px);box-shadow:0 20px 40px -24px rgba(18,18,18,.22);}
  .feedgrid .view-btn{transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .feedgrid .view-btn:active{transform:scale(.96);}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.feedgrid>.cardwrap{animation:none;}}

  /* ================= Wallet stack ================= */
  .w-stack{background:var(--grey-800);display:flex;flex-direction:column;align-items:center;}
  .w-today{background:var(--grey-50);width:100%;display:flex;gap:12px;align-items:center;justify-content:center;padding:8px 24px;border-bottom-left-radius:20px;border-bottom-right-radius:20px;}
  .w-today-txt{display:flex;gap:4px;align-items:center;font-size:14px;color:#000;}
  .w-today-txt b{font-weight:600;}
  .w-big{padding:40px 0;text-align:center;color:#fff;}
  .w-big .a{font-size:40px;font-weight:600;line-height:48px;}
  .w-big .s{font-size:14px;font-weight:500;line-height:20px;margin-top:4px;}
  .w-actions{background:var(--grey-50);width:100%;display:flex;gap:12px;padding:24px 16px 16px;border-top-left-radius:20px;border-top-right-radius:20px;}
  .w-actions .btn-secondary{flex:1;width:auto;}
  .w-recent{display:flex;flex-direction:column;gap:16px;}
  .w-daybar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .w-daybar .day{font-size:14px;font-weight:600;line-height:16px;color:var(--grey-500);}
  .w-daybar svg{width:24px;height:24px;}
  .w-txn{display:flex;flex-direction:column;gap:12px;}
  .w-txn .item{display:flex;gap:12px;align-items:flex-start;padding:0 16px;}
  .w-txn .logo{width:32px;height:32px;border-radius:20px;object-fit:cover;flex-shrink:0;background:#fff;}
  .w-txn .c{flex:1;display:flex;flex-direction:column;gap:8px;}
  .w-txn .desc{font-size:14px;line-height:20px;color:var(--grey-800);}
  .w-txn .desc b{font-weight:600;}
  .w-txn .time{display:flex;gap:8px;align-items:center;}
  .w-txn .time .ago{font-size:12px;line-height:16px;color:var(--grey-600);}
  .w-txn .time svg{width:16px;height:16px;color:var(--earn);}
  .w-divider{height:1px;background:var(--grey-100);margin:4px 12px;}
  .wallet{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:48px;align-items:start;}
  .wallet .w-stack{position:sticky;top:calc(var(--header) + 16px);}
  .wallet .w-recent{max-width:640px;}

  /* ================= My work ================= */
  .mw-logos{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:4px 16px 0;}
  .mw-logo72{width:72px;height:72px;border-radius:100px;border:1px solid var(--grey-200);overflow:hidden;flex-shrink:0;cursor:pointer;background:#fff;}
  .mw-logo72 img{width:100%;height:100%;object-fit:cover;}
  .mw-sheet{padding:16px;display:flex;flex-direction:column;gap:24px;}
  .mw-sec{display:flex;flex-direction:column;gap:24px;padding:32px 16px 0;}
  .mw-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;}
  .mw-card{position:relative;height:160px;border-radius:20px;overflow:hidden;width:100%;cursor:pointer;}
  .mw-card .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .mw-card-ov{position:absolute;inset:0;border-radius:20px;background:rgba(18,18,18,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:10px;}
  .mw-card-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%;}
  .mw-card-top .logo{width:36px;height:36px;border-radius:100px;object-fit:cover;background:#fff;}
  .mw-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .mw-card-right .badge{font-size:14px;font-weight:400;line-height:16px;color:var(--badge);}
  .mw-card-right .badge.ongoing{color:var(--badge-ongoing);}
  .mw-heart{display:flex;color:#fff;}
  .mw-heart svg{width:24px;height:24px;}
  .mw-card-bot{display:flex;align-items:flex-end;justify-content:space-between;width:100%;}
  .mw-bud{display:flex;flex:1;flex-direction:column;gap:4px;color:var(--grey-50);}
  .mw-bud .lbl{font-size:14px;font-weight:500;line-height:20px;}
  .mw-bud .amt{font-size:24px;font-weight:600;line-height:32px;}
  .mw-chip{grid-column:1/-1;display:flex;align-items:center;justify-content:center;background:var(--grey-200);border-radius:100px;padding:8px 16px;cursor:pointer;gap:10px;}
  .mw-chip.dark{background:transparent;padding:8px 20px;justify-content:space-between;}
  .mw-chip .chip-lbl{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);white-space:nowrap;}
  .mw-chip.dark .chip-lbl{color:var(--grey-50);}
  .mw-chip .chip-more{font-size:14px;font-weight:600;line-height:20px;padding:4px 8px;color:var(--grey-800);}
  .mw-chip.dark .chip-more{color:var(--grey-50);}
  .mw-pending{padding:8px 16px;}
  .mw-tags{display:flex;gap:8px;flex-wrap:wrap;}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;}
  .pagehead .page-title{padding-bottom:0;}

  /* ================= Campaign page ================= */
  .cp{display:grid;grid-template-columns:minmax(0,760px) 300px;column-gap:32px;row-gap:0;justify-content:center;align-items:start;margin:-24px auto -80px;}
  /* Main column sits between two full-height divider lines (top bar + content) */
  .cp-top,.cp-main{border-left:1px solid var(--grey-200);border-right:1px solid var(--grey-200);padding-left:24px;padding-right:24px;}
  .cp-main{padding-bottom:80px;}
  .cp-main{display:flex;flex-direction:column;min-width:0;}
  .cp-hero{position:relative;height:300px;border-radius:20px;overflow:hidden;background:var(--grey-200);}
  .cp-brandpill{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;align-items:center;padding:4px 14px 4px 4px;border-radius:100px;background:rgba(18,18,18,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:14px;font-weight:600;line-height:20px;color:#fff;}
  .cp-brandpill img{width:28px;height:28px;border-radius:100px;object-fit:cover;background:#fff;}
  .cp-hero>img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
  /* Top bar above the main image: back link on the left, like + share on the right */
  .cp-top{grid-row:1;grid-column:1;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:24px;padding-bottom:16px;}
  .cp>:not(.cp-top){grid-row:2;}
  .cp-back{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 8px 0;font-size:15px;font-weight:500;line-height:20px;color:var(--grey-600);transition:color .2s ease;}
  .cp-back svg{width:20px;height:20px;transition:transform .25s cubic-bezier(.16,1,.3,1);}
  .cp-back:hover{color:var(--grey-800);}
  .cp-back:hover svg{transform:translateX(-3px);}
  .cp-actions{display:flex;gap:12px;align-items:center;}
  .cp-round{width:40px;height:40px;border-radius:100px;background:#fff;border:1px solid var(--grey-200);display:flex;align-items:center;justify-content:center;color:var(--grey-800);transition:background .2s ease,border-color .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .cp-round svg{width:20px;height:20px;}
  .cp-round:hover{background:var(--grey-100);border-color:var(--grey-400);}
  .cp-round:active{transform:scale(.94);}
  .cp-details{display:flex;flex-direction:column;gap:12px;padding:20px 0 24px;}
  .cp-title{font-size:30px;font-weight:600;line-height:36px;letter-spacing:-.02em;color:var(--grey-800);}
  .cp-details>.cp-list{margin-top:12px;padding:8px 0 0;border-radius:0;}
  .cp-joined{display:flex;gap:8px;align-items:center;}
  .cp-avatars{display:flex;}
  .cp-avatars img{width:22px;height:22px;border-radius:20px;border:1.5px solid var(--grey-50);object-fit:cover;margin-left:-8px;background:#ddd;}
  .cp-avatars img:first-child{margin-left:0;}
  .cp-joined .count{font-size:14px;font-weight:500;color:var(--grey-600);}
  .cp-infotags{padding:24px 10px;display:flex;flex-direction:column;gap:16px;align-items:center;}
  .cp-infotags h3{font-size:16px;font-weight:600;line-height:20px;color:var(--grey-800);text-align:center;}
  .cp-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;}
  .cp-tag{background:var(--grey-200);display:flex;gap:4px;align-items:center;justify-content:center;padding:6px 12px;border-radius:100px;}
  .cp-tag svg{width:20px;height:20px;color:var(--grey-800);}
  .cp-tag span{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);}
  .cp-event{display:flex;justify-content:center;padding:16px 24px;}
  .cp-event-card{display:flex;flex-direction:column;gap:12px;align-items:center;padding:16px 20px;}
  .cp-event-info{display:flex;flex-direction:column;align-items:center;}
  .cp-event-info .line{font-size:20px;font-weight:600;line-height:24px;color:var(--grey-50);text-align:center;}
  .cp-event-info .mut{color:var(--grey-500);}
  .cp-event-row{display:flex;gap:8px;align-items:center;justify-content:center;}
  .cp-event-ic{width:24px;height:24px;flex-shrink:0;color:var(--grey-50);}
  .cp-event-ic svg{width:24px;height:24px;}
  .cp-event-cta{display:flex;flex-direction:column;align-items:center;}
  .cp-event-cta .lbl{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-500);}
  .cp-event-link{display:flex;gap:4px;align-items:center;cursor:pointer;}
  .cp-event-link span{font-size:14px;font-weight:500;line-height:20px;color:var(--blue-300);}
  .cp-event-link .ext{width:16px;height:16px;color:var(--blue-300);}
  .cp-event-link .ext svg{width:16px;height:16px;}
  .cp-reqs{padding:32px 24px 16px;display:flex;flex-direction:column;gap:12px;}
  .cp-reqs h3,.cp-createdby>h3{font-size:16px;font-weight:600;line-height:20px;color:#000;}
  .cp-reqs{gap:32px;}
  .cp-sec{display:flex;flex-direction:column;gap:12px;}
  .cp-reqs p{font-size:14px;line-height:20px;color:#000;max-width:640px;}
  .cp-reqs h4{font-size:12px;font-weight:600;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-600);margin-top:12px;}
  .cp-spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .cp-spectile{background:var(--grey-100);border:1px solid var(--grey-200);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;}
  .cp-spectile .k{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-spectile .v{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .cp-plats{display:flex;flex-wrap:wrap;gap:8px;}
  .cp-plat{display:flex;gap:6px;align-items:center;padding:8px 14px;border-radius:100px;background:#fff;border:1px solid var(--grey-200);font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);}
  .cp-plat svg{width:18px;height:18px;}
  .cp-ctas{background:var(--blue-100);border-left:3px solid var(--blue-500);border-radius:0 12px 12px 0;padding:16px 20px;display:flex;flex-direction:column;gap:8px;}
  .cp-ctas p{font-style:italic;color:var(--grey-800);}
  .cp-restrict{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px;}
  .cp-restrict li{counter-increment:r;display:flex;gap:12px;align-items:center;font-size:14px;line-height:20px;color:var(--grey-800);}
  .cp-restrict li::before{content:counter(r);width:24px;height:24px;flex-shrink:0;border-radius:100px;background:var(--grey-100);border:1px solid var(--grey-200);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--grey-600);}
  .cp-meta{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-600);}
  .cp-mi{display:flex;gap:6px;align-items:center;white-space:nowrap;}
  .cp-mi svg{width:16px;height:16px;}
  .cp-metaplat{display:flex;gap:12px;align-items:center;color:var(--grey-600);}
  .cp-metaplat svg{width:16px;height:16px;}
  .cp-budgetline{margin-top:10px;font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-createdby{display:flex;flex-direction:column;gap:16px;padding:32px 0 10px;}
  .cp-join{padding-top:24px;}
  .cp-join .btn-primary{padding:16px 24px;font-size:16px;font-weight:600;line-height:24px;}
  .cp-main>div:not(.band)>.cp-reqs{padding-left:0;padding-right:0;}
  .cp-creatorcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:8px 0 16px;}
  .cp-creatorcard .col{display:flex;flex-direction:column;gap:16px;}
  .cp-identity{display:flex;flex-direction:column;gap:16px;align-items:center;padding:16px 32px 4px;}
  .cp-identity .av{width:64px;height:64px;border-radius:100px;object-fit:cover;background:#fff;}
  .cp-idtext{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .cp-identity .name{font-size:20px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .cp-identity .since{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-cdesc{padding:0 24px;font-size:14px;line-height:20px;color:#000;text-align:center;}
  .cp-stats{display:flex;align-items:center;justify-content:center;padding:16px 24px;}
  .cp-stat{display:flex;flex-direction:column;align-items:center;flex:1;}
  .cp-stat .big{font-size:20px;font-weight:600;color:var(--grey-800);}
  .cp-stat .lbl{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-600);}
  .cp-stat-div{width:1px;height:39px;background:var(--grey-200);}
  .cp-cmetrics{display:flex;flex-direction:column;gap:8px;padding:24px 24px 8px 8px;}
  .cp-cmetrics .row{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:20px;}
  .cp-cmetrics .row .k{font-weight:400;color:var(--grey-600);}
  .cp-cmetrics .row .v{font-weight:600;color:var(--grey-800);}
  .cp-cmetrics .div{height:1px;background:var(--grey-100);margin:4px 0;}
  .handles{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .handle{display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px;position:relative;flex-shrink:0;}
  .handle .pf{width:64px;height:64px;border-radius:100px;object-fit:cover;background:#fff;}
  .handle .badge{position:absolute;left:52px;top:0;background:#fff;padding:6px;border-radius:20px;display:flex;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));color:#121212;}
  .handle .badge svg{width:12px;height:12px;}
  .handle .fc{font-size:14px;font-weight:500;line-height:20px;color:#121212;}
  .cp-questions{padding:8px 24px 0 8px;}

  .cp.no-side{grid-template-columns:minmax(0,760px);}
  .cp-side{position:sticky;top:calc(var(--header) + 16px);display:flex;flex-direction:column;gap:16px;}
  /* Similar campaigns — left column, desktop landscape only */
  .cp-similar{display:none;}
  @media (min-width:1440px) and (orientation:landscape){
    body.wide{--page:1440px;}
    .cp{--side:280px;--sim:320px;grid-template-columns:var(--sim) minmax(0,760px) var(--side);justify-content:space-between;}
    .cp.no-side{--sim:360px;grid-template-columns:var(--sim) minmax(0,760px);justify-content:center;column-gap:48px;}
    .cp-top{grid-column:2;}
    .cp>.cp-similar{grid-row:1 / span 2;display:flex;flex-direction:column;gap:12px;position:sticky;top:var(--header);max-height:calc(100dvh - var(--header));padding-top:24px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;margin-right:-8px;padding-bottom:8px;
      scrollbar-width:thin;scrollbar-color:var(--grey-400) transparent;scrollbar-gutter:stable;}
    .cp-similar h3{position:sticky;top:0;z-index:1;background:var(--grey-50);padding-bottom:8px;margin-bottom:-4px;}
    .cp-similar::-webkit-scrollbar{width:6px;}
    .cp-similar::-webkit-scrollbar-track{background:transparent;}
    .cp-similar::-webkit-scrollbar-thumb{background:var(--grey-400);border-radius:100px;}
    .cp-similar::-webkit-scrollbar-thumb:hover{background:var(--grey-600);}
  }
  .cp-similar h3{font-size:16px;font-weight:600;line-height:20px;color:var(--grey-800);padding:4px 4px 4px;}
  /* Same campaign card as the explore feed, scaled down for the column */
  .sim-list{display:flex;flex-direction:column;gap:16px;}
  .cp-similar .cardwrap{padding:8px;flex-shrink:0;background:#fff;border:1px solid var(--grey-200);border-radius:24px;transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s cubic-bezier(.16,1,.3,1);}
  .cp-similar .cardwrap:hover{transform:translateY(-2px);box-shadow:0 20px 40px -24px rgba(18,18,18,.22);}
  .cp-similar .card-img{height:190px;border-radius:16px;}
  .cp-similar .card-logobar{padding:12px;}
  .cp-similar .card-logobar .logo{width:28px;height:28px;}
  .cp-similar .heart{width:20px;height:20px;}
  .cp-similar .overlaybar{height:48px;padding:0 10px 0 14px;}
  .cp-similar .overlaybar::before{border-radius:16px;}
  .cp-similar .details{gap:5px;}
  .cp-similar .details svg{width:12px;height:12px;}
  .cp-similar .price-chip{font-size:11px;line-height:11px;padding:3px 7px;}
  .cp-similar .view-btn{padding:6px 14px;font-size:12px;line-height:16px;}
  .cp-similar .card-content{gap:6px;padding:10px 8px 8px;}
  .cp-similar .card-content .ctitle{font-size:14px;line-height:18px;}
  .cp-similar .card-time{font-size:11px;line-height:11px;}
  .cp-similar .card-foot{font-size:11px;justify-content:flex-end;}
  .cp-similar .card-foot .joined{display:none;}
  .cp-similar .card-foot .money{gap:3px;}
  .cp-similar .card-foot .joined svg{width:12px;height:12px;}
  .sim-all{flex-shrink:0;text-align:center;padding:12px;border-radius:100px;background:var(--grey-100);font-size:14px;font-weight:500;color:var(--grey-800);transition:background .25s ease;}
  .sim-all:hover{background:var(--grey-200);}
  .cp-side .wcard{padding:8px 0 16px;display:flex;flex-direction:column;}
  /* status card (Ongoing / Pending approval / Completed) */
  .sbo-green{background:var(--ongoing);border-radius:20px;width:100%;display:flex;flex-direction:column;}
  .sbo-green.pending{background:var(--pending);}
  .sbo-green.completed{background:var(--blue-500);}
  .sbo-green-label{text-align:center;padding:4px 0;font-size:12px;font-weight:500;color:#fff;}
  .sbo-green-box{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:4px 4px 6px rgba(0,0,0,.12);}
  .sbo-earn{display:flex;flex-direction:column;align-items:center;color:var(--blue-500);}
  .sbo-earn .lbl{font-size:16px;font-weight:500;line-height:20px;}
  .sbo-earn .amt{font-size:24px;font-weight:600;line-height:32px;}
  .sbo-thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
  .sbo-thumb{position:relative;height:150px;border-radius:20px;overflow:hidden;}
  .sbo-thumb img{width:100%;height:100%;object-fit:cover;}
  .sbo-thumb .badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:100px;background:var(--grey-50);display:flex;align-items:center;justify-content:center;filter:drop-shadow(2px 4px 4px rgba(0,0,0,.4));color:#121212;}
  .sbo-thumb .badge svg{width:24px;height:24px;}
  .sbo-earndetails{width:100%;padding:4px 0 0;display:flex;flex-direction:column;gap:8px;}
  .sbo-earndetails .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;line-height:16px;}
  .sbo-earndetails .k{color:var(--grey-800);font-weight:400;}
  .sbo-earndetails .v{font-weight:600;color:var(--grey-800);}
  .sbo-earndetails .blue{color:var(--blue-500);}
  .sbo-earndetails .ed-div{height:1px;background:var(--grey-100);}
  .sbo-earndetails .btn-secondary{margin-top:12px;}

  /* ================= Profile ================= */
  .profile{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:48px;align-items:start;}
  .pf-left{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--header) + 16px);}
  .pf-handle{display:flex;gap:4px;align-items:center;justify-content:center;padding:4px 0 8px;}
  .pf-handle span{font-size:16px;font-weight:600;color:#000;}
  .pf-handle svg{width:24px;height:24px;color:#121212;}
  .pf-identity{padding:8px 0 16px;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .pf-av{width:92px;height:92px;border-radius:100px;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 1px var(--grey-200);}
  .pf-idtext{display:flex;gap:4px;align-items:center;}
  .pf-idtext .name{font-size:24px;font-weight:600;line-height:32px;color:var(--grey-800);}
  .pf-idtext .shield svg{width:24px;height:24px;color:#1548eb;}
  .pf-lifetime{display:flex;flex-direction:column;gap:4px;align-items:center;padding:16px 0;color:var(--grey-50);}
  .pf-lifetime .lbl{font-size:14px;font-weight:500;line-height:20px;}
  .pf-lifetime .amt{font-size:28px;font-weight:600;line-height:38px;}
  .pf-metrics{padding:16px 48px;display:flex;align-items:center;justify-content:center;}
  .pf-stat{display:flex;flex-direction:column;align-items:center;flex:1;}
  .pf-stat .big{font-size:20px;font-weight:600;line-height:24px;color:var(--grey-800);}
  .pf-stat .lbl{font-size:14px;font-weight:600;line-height:16px;color:var(--grey-600);}
  .pf-stat-div{width:1px;height:39px;background:var(--grey-200);}
  .pf-campaigns{display:flex;flex-direction:column;gap:8px;}
  .pf-crow{background:var(--grey-100);border:1px solid var(--grey-200);display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 16px;border-radius:20px;overflow:hidden;cursor:pointer;}
  .pf-crow>span{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);}
  .pf-cright{display:flex;gap:4px;align-items:center;}
  .pf-cright img{width:20px;height:20px;border-radius:100px;object-fit:cover;background:#fff;}
  .pf-more{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-600);padding:4px 8px;}
  .pf-divider{height:1px;background:var(--grey-200);margin:0 12px;}
  .pf-links{display:flex;flex-direction:column;gap:4px;padding:4px 0 8px;font-size:14px;font-weight:500;}
  .pf-links a{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:16px;color:#121212;}
  .pf-links a:hover{background:var(--grey-100);}
  .pf-links a .ic{width:20px;height:20px;color:var(--grey-700);flex-shrink:0;display:flex;}
  .pf-links a .ic svg{width:20px;height:20px;}
  .pf-links a .lbl{flex:1;}
  .pf-links a .chev{width:20px;height:20px;color:var(--grey-500);display:flex;}
  .pf-links a .chev svg{width:20px;height:20px;}
  .pf-links a.logout,.pf-links a.logout .ic{color:var(--pink-500);}
  .pf-right{display:flex;flex-direction:column;gap:24px;min-width:0;padding-top:4px;}
  .pf-sec{display:flex;flex-direction:column;gap:12px;}
  .pf-sectitle{font-size:16px;font-weight:600;line-height:20px;color:#000;}
  .pf-smhandles{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .addhandle{display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px;flex-shrink:0;cursor:pointer;}
  .addhandle .circle{width:64px;height:64px;border-radius:100px;background:#fff;border:1px dashed var(--grey-500);display:flex;align-items:center;justify-content:center;color:var(--grey-500);}
  .addhandle.solid .circle{border:1px solid var(--grey-200);}
  .addhandle .circle svg{width:20px;height:20px;}
  .addhandle span{font-size:14px;font-weight:500;color:#121212;}
  .vline{width:1px;height:72px;background:var(--grey-200);flex-shrink:0;}
  .pf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .pf-grid img{width:100%;aspect-ratio:115/174;object-fit:cover;border-radius:12px;background:#ddd;}

  /* ================= Settings ================= */
  .settings{display:grid;grid-template-columns:220px minmax(0,560px);gap:48px;align-items:start;}
  .set-nav{position:sticky;top:calc(var(--header) + 16px);}
  .set-block{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px 0;scroll-margin-top:calc(var(--header) + 16px);}
  .set-block+.set-block::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:var(--grey-200);}
  .set-blocktitle{padding:0 16px;font-size:16px;font-weight:600;line-height:20px;color:#000;}
  .set-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;cursor:pointer;}
  .set-row:hover{background:var(--grey-100);}
  .set-ic{width:22px;height:22px;color:var(--grey-700);flex-shrink:0;display:flex;}

function renderFeed(){
  const f=document.getElementById('feed'); if(!f) return;
  if(!state.loaded){
    f.innerHTML=Array.from({length:6},()=>`<div class="sk-card"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>`).join('');
    setTimeout(()=>{state.loaded=true;renderFeed();},600);return;
  }
  const q=state.q.trim().toLowerCase();
  let ids=EXPLORE.filter(id=>{const c=C[id];
    if(!['All','Price'].includes(state.cat)&&c.cat!==state.cat) return false;
    return !q||(c.title+' '+c.brand).toLowerCase().includes(q);});
  if(state.cat==='Price') ids=[...ids].sort((a,b)=>C[b].budgetN-C[a].budgetN);
  f.innerHTML=ids.length?ids.map((id,i)=>cardHTML(id).replace('class="cardwrap"',`class="cardwrap" style="--i:${i}"`)).join('')
    :`<div class="ph"><div class="tag2">No campaigns</div><h2>Nothing matches “${esc(state.q||state.cat)}”</h2><p>Try another brand name or clear the search to see every open campaign.</p><div class="tag" data-act="clear">Clear filters</div></div>`;
  bindAssets(f);
}

/* Search lives under the Campaigns heading; the header icon opens and closes it */
function setSearch(open){
  state.searchOpen=open;
  const btn=document.getElementById('search-btn');
  btn.classList.toggle('on',open);btn.setAttribute('aria-expanded',open);
  const wrap=document.getElementById('home-search'); if(!wrap) return;
  wrap.classList.toggle('open',open);
  const input=document.getElementById('q');
  input.tabIndex=open?0:-1;
  if(open) input.focus({preventScroll:true});
  else if(state.q){state.q='';input.value='';renderFeed();}
}
function toggleSearch(){
  if(!document.getElementById('home-search')){state.searchOpen=true;location.hash='#/explore';return;}
  setSearch(!state.searchOpen);
}

/* ================= Router ================= */
const view=document.getElementById('view');
const hist=[];
let prev={root:null,a:null};
function route(){
  const h=location.hash.replace(/^#\/?/,'')||'explore';
  const [root,a,b]=h.split('/');
  const known=['campaign','mywork','wallet','profile','settings','submit'];
  const r=known.includes(root)?root:'explore';
  const tabSwitch=r==='mywork'&&prev.root==='mywork'&&(a||'all')!==(prev.a||'all');
  let html,title='Campaigns';
  if(r==='campaign'){html=viewCampaign(a,b);title=(C[a]||{}).title||'Campaign';}
  else if(r==='mywork'){html=viewMyWork(a);title='My work';}
  else if(r==='wallet'){html=viewWallet();title='My wallet';}
  else if(r==='profile'){html=viewProfile();title='My profile';}
  else if(r==='settings'){html=viewSettings();title='Account settings';}
  else if(r==='submit'){html=viewSubmit(a);title='Submit content';}
  else html=viewExplore();
  view.innerHTML=html;
  document.body.classList.toggle('wide',r==='campaign');
  bindAssets(view);
  if(tabSwitch) staggerMyWork();
  else {view.classList.remove('nav-in');void view.offsetWidth;view.classList.add('nav-in');window.scrollTo({top:0,behavior:'instant'});}
  renderFeed();
  if(r==='explore'&&state.searchOpen) setSearch(true); else document.getElementById('search-btn').classList.remove('on');
  if(r!=='explore') state.searchOpen=false;
  document.title=title+' — UGC Platform';
  const navRoot=r==='campaign'?(b||(C[a]&&C[a].status)?'mywork':'explore'):r==='submit'?'explore':r;
  document.querySelectorAll('#tnav a').forEach(n=>n.classList.toggle('active',n.dataset.root===navRoot));
  if(hist[hist.length-1]!==location.hash) hist.push(location.hash);
  prev={root:r,a};
  closePop();closeOverlay();
}
window.addEventListener('hashchange',route);

/* My work tag switch: tag pop + staggered 3D reveal, as on mobile */
function staggerMyWork(){
  const t=view.querySelector('.mw-tags .tag.active'); if(t) t.classList.add('pop');
  [...view.querySelectorAll('.sechead,.mw-logo72,.mw-card,.mw-chip,.cardwrap')].forEach((el,i)=>{
    el.style.animationDelay=Math.min(i*55,440)+'ms'; el.classList.add('mw-stagger');
    el.addEventListener('animationend',()=>{el.classList.remove('mw-stagger');el.style.animationDelay='';},{once:true});
  });
}

document.addEventListener('click',e=>{
  const t=e.target;
  const heart=t.closest('.like-heart');
  if(heart){e.preventDefault();e.stopPropagation();heart.classList.toggle('liked');return;}
  if(t.closest('[data-search]')){e.preventDefault();toggleSearch();return;}
  if(t.closest('[data-pop]')){e.preventDefault();pop.classList.toggle('open');return;}
  if(pop.classList.contains('open')&&!t.closest('#pop-notifs')) closePop();
  const cl=t.closest('[data-close]');
  if(cl){closeOverlay();if(cl.dataset.toast)toast(cl.dataset.toast);if(cl.dataset.go)location.hash=cl.dataset.go;return;}
  const cat=t.closest('[data-cat]');
  if(cat){state.cat=cat.dataset.cat;document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c===cat));renderFeed();return;}
  const tg=t.closest('[data-tg]');
  if(tg){tg.querySelector('.tg').classList.toggle('on');return;}
  const chk=t.closest('[data-check]');
  if(chk){chk.classList.toggle('on');chk.classList.remove('bad');return;}
  const sc=t.closest('[data-scroll]');
  if(sc){document.getElementById(sc.dataset.scroll).scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.closest('[data-back]')){e.preventDefault();if(hist.length>1){hist.pop();location.hash=hist.pop();}else location.hash='#/explore';return;}
  const act=t.closest('[data-act]');
  if(act){e.preventDefault();return doAct(act.dataset.act,act);}
  const go=t.closest('[data-go]');
  if(go&&!t.closest('a[href]')){location.hash=go.dataset.go;}
});
function doAct(a,el){
  if(a==='soon') return toast('This screen is next to build');
  if(a==='share') return toast('Link copied');
  if(a==='clear'){state.cat='All';state.q='';const qi=document.getElementById('q');if(qi)qi.value='';document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c.dataset.cat==='All'));return renderFeed();}
  if(a==='upload') return document.getElementById('file').click();
  if(SHEETS[a]) return openOverlay(SHEETS[a]());
}

/* Upload */
function setUpload(name,size){
  state.upload=name;const d=document.getElementById('drop');if(!d) return;
  d.classList.add('has');document.getElementById('drop-t').textContent=name;
  document.getElementById('drop-s').textContent=(size/1048576).toFixed(1)+' MB · click to replace';
}
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)setUpload(f.name,f.size);e.target.value='';});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)setUpload(f.name,f.size);}});

/* Submit validation: at least one valid post link + terms accepted */
document.addEventListener('submit',e=>{
  if(e.target.id!=='sform') return; e.preventDefault();
  const inputs=[...document.querySelectorAll('.sc-linkinput')];
  let filled=0,anyBad=false;
  inputs.forEach(i=>{const v=i.value.trim(),bad=!!v&&!LINKRE[i.dataset.plat].test(v);if(v)filled++;anyBad=anyBad||bad;document.getElementById('g-'+i.dataset.plat).classList.toggle('bad',bad);});
  const none=!filled; document.getElementById('g-links').classList.toggle('none',none);
  const terms=document.getElementById('terms'),tOk=terms.classList.contains('on');terms.classList.toggle('bad',!tOk);
  const msg=document.getElementById('form-msg');
  if(none||anyBad||!tOk){msg.textContent=none?'Add at least one post link to continue':anyBad?'Fix the highlighted link to continue':'Please accept the Terms & Conditions';return;}
  msg.textContent='';
  const btn=document.getElementById('sbtn');btn.disabled=true;btn.textContent='Submitting…';
  setTimeout(()=>{btn.disabled=false;btn.textContent='Submit for approval';openOverlay(SHEETS.submitted());},900);
});
const LINKRE={tiktok:/^https?:\/\/(www\.|vm\.|m\.)?tiktok\.com\/\S+/i,insta:/^https?:\/\/(www\.)?instagram\.com\/\S+/i,
  youtube:/^https?:\/\/((www\.|m\.)?youtube\.com|youtu\.be)\/\S+/i,facebook:/^https?:\/\/((www\.|m\.|web\.)?facebook\.com|fb\.watch)\/\S+/i,linkedin:/^https?:\/\/(www\.)?linkedin\.com\/\S+/i};
document.addEventListener('input',e=>{const g=e.target.closest('.sc-linkgroup');if(g){g.classList.remove('bad');document.getElementById('g-links').classList.remove('none');}});

/* Search filters the campaign feed */
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;renderFeed();}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(state.searchOpen&&document.getElementById('q'))document.getElementById('q').focus();else toggleSearch();}
  if(e.key==='Escape'){if(state.searchOpen&&document.activeElement.id==='q'){setSearch(false);document.getElementById('search-btn').focus();}closePop();closeOverlay();}
});

/* ===== Init ===== */
renderTopNav();
bindAssets(document.body);
renderNotifs();
route();
</script>
