<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGC Platform — Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens — identical to the mobile prototype (from Figma).
     Desktop only adds layout: widths, columns and the top menu.
     ===================================================================== */
  :root{
    --grey-50:#fff; --grey-50-90:rgba(255,255,255,.9);
    --grey-100:#ececec; --grey-100-20:rgba(236,236,236,.2);
    --grey-200:#d9d9d9; --grey-400:#b3b3b3; --grey-500:#a0a0a0;
    --grey-600:#717171; --grey-700:#414141; --grey-800:#121212;
    --blue-100:#d0dafb; --blue-200:#a1b6f7; --blue-300:#7391f3; --blue-500:#1548eb; --blue-600:#123bbd; --blue-700:#0f2d8f;
    --pink-500:#f433ab;
    --font:'Inter',-apple-system,system-ui,sans-serif;

    /* status colours used by the mobile campaign pages */
    --ongoing:#07b11e; --pending:#e8890c; --pending-card:#a32dd2; --liked:#FF6B4A; --badge:#ffd22d; --badge-ongoing:#3be06a; --earn:#2e8b3d;

    /* desktop layout */
    --gutter:24px; --rail:300px; --page:1128px; --header:52px;
    /* The top bar keeps its own width so it never shifts when a page (e.g. body.wide) widens --page */
    --shell:1128px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* Reserve the scrollbar space on every page so short and long pages line up */
  html{scrollbar-gutter:stable;}
  body{background:var(--grey-50);color:var(--grey-800);font-family:var(--font);font-size:14px;line-height:20px;min-height:100dvh;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img{display:block;}
  svg{display:block;}

  /* Screen navigation transition — same signature as the mobile app */
  @keyframes screenIn{from{opacity:0;transform:translateY(17px) scale(.988);filter:blur(5px);}to{opacity:1;transform:none;filter:blur(0);}}
  .nav-in{animation:screenIn .46s cubic-bezier(.16,1,.3,1) both;}
  @media(prefers-reduced-motion:reduce){.nav-in{animation:none;}}

  /* ================= App shell: top menu ================= */
  .topbar{position:sticky;top:0;z-index:20;height:var(--header);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 max(var(--gutter),calc((100% - var(--shell)) / 2));
    background:var(--grey-50-90);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--grey-200);}
  .brand{grid-column:1;justify-self:start;display:flex;align-items:center;height:32px;color:var(--grey-800);border-radius:8px;transition:opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .brand svg{height:18px;width:auto;aspect-ratio:269/184;}
  .brand:hover{opacity:.8;}
  .brand:active{transform:scale(.96);}
  .tnav{grid-column:2;display:flex;align-items:center;gap:4px;}
  .tnav a{width:52px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-500);transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .tnav a svg{height:17px;width:auto;max-width:20px;}
  .tnav a:hover{background:var(--grey-100);color:var(--grey-700);}
  .tnav a.active{color:var(--grey-800);}
  .tnav a:active{transform:scale(.94);}
  .top-right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px;}
  .wallet-pill{display:flex;align-items:center;height:32px;background:var(--blue-500);padding:0 14px;border-radius:100px;cursor:pointer;transition:background .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .wallet-pill:hover{background:var(--blue-600);}
  .wallet-pill:active{transform:scale(.97);}
  .wallet-pill span{font-size:14px;font-weight:600;line-height:20px;letter-spacing:-.01em;color:var(--grey-50);font-variant-numeric:tabular-nums;}
  .hicon{width:32px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-800);position:relative;background:#fff;border:1px solid var(--grey-200);transition:background .25s ease,border-color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .hicon:hover{background:var(--grey-100);}
  .hicon:active{transform:scale(.94);}
  .hicon.on{background:var(--grey-800);border-color:var(--grey-800);color:var(--grey-50);}
  .hicon svg{width:17px;height:17px;}
  .hicon .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .top-av{display:block;width:32px;height:32px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .top-av:active{transform:scale(.94);}
  /* Hamburger + its menu are phone-only; desktop keeps the logo and icon nav */
  .menu-btn{display:none;width:40px;height:40px;border:0;background:none;border-radius:100px;align-items:center;justify-content:center;color:var(--grey-800);cursor:pointer;transition:background .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .menu-btn svg{width:24px;height:24px;}
  .menu-btn:active{transform:scale(.94);}
  .menu-btn.on{background:var(--grey-800);color:var(--grey-50);}
  .drawer,.drawer-scrim{display:none;}
  .menu-list{display:flex;flex-direction:column;gap:4px;}
  .menu-list .set-row.active{background:var(--grey-100);}

  .content{width:100%;max-width:calc(var(--page) + var(--gutter) * 2);margin:0 auto;padding:18px var(--gutter) 60px;}

  /* ================= Shared (mobile components) ================= */
  .page-title{font-size:22px;font-weight:600;line-height:30px;color:#000;padding:3px 0 12px;}
  .h20{font-size:18px;font-weight:600;line-height:22px;color:var(--grey-800);}
  .h16{font-size:15px;font-weight:600;line-height:19px;color:#000;}
  .sub{font-size:14px;line-height:20px;color:var(--grey-600);}

  .tags{display:flex;gap:9px;flex-wrap:wrap;}
  .tag{flex-shrink:0;padding:6px 9px;border-radius:75px;background:var(--grey-100);font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);white-space:nowrap;cursor:pointer;transition:background .25s ease,color .25s ease;}
  .tag.active{background:var(--blue-200);}
  .tag.tag-pop{animation:mwTagPop .36s cubic-bezier(.34,1.56,.64,1);}
  @keyframes mwTagPop{0%{transform:scale(.82);}55%{transform:scale(1.1);}100%{transform:scale(1);}}

  .sechead{display:flex;align-items:center;justify-content:space-between;padding:0 12px;}
  .seeall{font-size:12px;font-weight:500;line-height:12px;color:var(--blue-600);cursor:pointer;}

  /* Buttons */
  .btn-primary{background:var(--blue-500);padding:9px 15px;border-radius:75px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 5px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-50);}
  .btn-secondary{background:var(--grey-200);border:2px solid var(--grey-200);padding:9px 15px;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 5px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);}
  .btn-dark{background:var(--grey-800);border:2px solid var(--grey-800);padding:9px 15px;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 5px rgba(0,0,0,.08);cursor:pointer;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-50);}
  .btn-questions{background:var(--blue-100);border:2px solid var(--blue-100);padding:9px 0;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 5px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--blue-700);}
  .view-btn,.mw-join{background:var(--grey-50);padding:9px 15px;border-radius:75px;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);box-shadow:2px 2px 9px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .btn-primary[disabled]{opacity:.6;pointer-events:none;}
  .iconbtn{display:flex;align-items:center;padding:3px;border-radius:15px;background:rgba(246,246,246,.5);cursor:pointer;color:#121212;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .iconbtn svg{width:24px;height:24px;}

  /* Heart like interaction */
  .like-heart{cursor:pointer;display:flex;}
  .like-heart svg{transition:transform .2s ease;}
  .like-heart.liked path{fill:var(--liked);}
  .like-heart.liked svg{animation:heartpop .3s ease;}
  @keyframes heartpop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}

  .logos{display:flex;}
  .logos img{width:20px;height:20px;border-radius:15px;object-fit:cover;margin-left:-6px;border:1.5px solid var(--grey-50);background:#fff;}
  .logos img:first-child{margin-left:0;}
  .chip-right{display:flex;gap:3px;align-items:center;}
  .chip-right img{width:20px;height:20px;border-radius:75px;object-fit:cover;background:#fff;}

  .progress{height:6px;border-radius:75px;background:#ddd;overflow:hidden;}
  .progress .fill{height:6px;background:var(--blue-500);border-radius:15px;}

  /* Key / value list (cp-list) */
  .cp-list{padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:8px;width:100%;}
  .cp-list .row{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px;line-height:20px;}
  .cp-list .row .k{font-weight:500;color:var(--grey-600);}
  .cp-list .row .v{font-weight:600;color:var(--grey-800);text-align:right;white-space:nowrap;}
  .cp-list .div{height:1px;background:var(--grey-200);margin:0;}
  .cp-list .social{display:flex;gap:8px;align-items:center;}
  .cp-list .social svg{width:16px;height:16px;color:var(--grey-800);}

  /* White card (creator card) */
  .wcard{background:#fff;border-radius:15px;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.12));}

  /* Dark band with rounded grey sheets — the app's signature */
  .band{background:var(--grey-800);display:flex;flex-direction:column;}
  .band.pill{border-radius:75px;}
  .sheet-b{background:var(--grey-50);border-radius:0 0 21px 21px;}
  .sheet-t{background:var(--grey-50);border-radius:21px 21px 0 0;}

  /* Placeholder / empty state (.ph from mobile) */
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:9px;grid-column:1/-1;}
  .ph .tag2{background:var(--blue-100);color:var(--blue-700);font-size:12px;font-weight:600;padding:5px 9px;border-radius:75px;}
  .ph h2{font-size:20px;font-weight:600;color:var(--grey-800);line-height:27px;}
  .ph p{font-size:14px;line-height:20px;color:var(--grey-600);max-width:210px;}

  /* Skeleton while the feed loads */
  .sk{background:var(--grey-100);border-radius:9px;position:relative;overflow:hidden;}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.3s infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
  .sk-card{display:flex;flex-direction:column;gap:6px;padding:9px;}
  .sk-card .l1{margin-top:15px;}
  .sk-card .img{height:180px;border-radius:15px;}
  .sk-card .l1{height:20px;width:80%;margin:12px 12px 0;}
  .sk-card .l2{height:12px;width:40%;margin:0 12px;}
  .sk-card .l3{height:6px;margin:3px 12px 12px;border-radius:75px;}

  /* Staggered reveal on My work tag switch (mwRise from mobile) */
  @keyframes mwRise{0%{opacity:0;transform:perspective(675px) rotateX(-22deg) translateY(35px) scale(.94);filter:blur(5px);}55%{opacity:1;filter:blur(0);}100%{opacity:1;transform:perspective(675px) rotateX(0deg) translateY(0) scale(1);filter:blur(0);}}
  .mw-stagger{animation:mwRise .58s cubic-bezier(.2,.8,.24,1.12) both;transform-origin:center bottom;backface-visibility:hidden;}
  @keyframes mwPopIn{0%{opacity:0;transform:scale(.3);}60%{opacity:1;transform:scale(1.12);}100%{opacity:1;transform:scale(1);}}
  .mw-logo72.mw-stagger{animation:mwPopIn .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center;}

  /* ================= Campaign card (home feed) ================= */
  .cardwrap{padding:9px;}
  .card-img{position:relative;height:180px;border-radius:15px;overflow:hidden;box-shadow:0 2px 2px rgba(0,0,0,.16);cursor:pointer;background:var(--grey-200);}
  .card-img>.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card-logobar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px;}
  .card-logobar .logo{width:27px;height:27px;border-radius:75px;border:1px solid var(--grey-50);object-fit:cover;background:#fff;}
  .heart{width:24px;height:24px;color:#fff;}
  .heart path{fill:rgba(18,18,18,.6);}
  .overlaybar{position:absolute;bottom:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 17px;}
  .overlaybar::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:15px;z-index:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .overlaybar>*{position:relative;z-index:1;}
  .details{display:flex;gap:5px;align-items:center;}
  .details svg{width:14px;height:14px;color:#fff;}
  .price-chip{background:var(--grey-100-20);padding:3px 6px;border-radius:15px;font-size:12px;font-weight:500;color:#fff;line-height:12px;}
  .pending-card{background:var(--pending-card);border-radius:15px;width:100%;display:flex;flex-direction:column;overflow:hidden;}
  .pending-card .heart path{fill:var(--liked);stroke:#fff;}
  .pending-earned{text-align:center;padding:5px 0;font-size:14px;font-weight:500;line-height:16px;color:var(--grey-50);}
  .card-content{display:flex;flex-direction:column;gap:6px;padding:12px;}
  .card-content .ctitle{font-size:15px;font-weight:600;line-height:19px;color:#000;cursor:pointer;}
  .cardwrap .ctitle{min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-time{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}
  .card-time .dot{width:2px;height:2px;border-radius:2px;background:var(--grey-600);}
  .progress-group{display:flex;flex-direction:column;gap:3px;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:normal;}
  .card-foot .joined{display:flex;gap:3px;align-items:center;font-weight:500;color:var(--grey-800);}
  .card-foot .joined svg{width:14px;height:14px;color:#131927;}
  .card-foot .money{display:flex;gap:3px;align-items:center;white-space:nowrap;color:var(--grey-800);font-weight:500;}
  .card-foot .money b{font-weight:600;color:var(--grey-800);}

  /* ================= Home: Campaigns ================= */
  /* Vertical rhythm: 32px from the header, 16px between heading / search / tags, 32px to the grid */
  .home{padding-top:6px;}
  .home-title{font-size:24px;font-weight:600;line-height:30px;letter-spacing:-.02em;color:#000;}
  /* Search reveals under the heading (toggled from the header search icon) */
  .home-search{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1),margin-top .45s cubic-bezier(.16,1,.3,1);}
  .home-search>div{overflow:hidden;min-height:0;}
  .home-search .search{opacity:0;transform:translateY(-6px);transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1);}
  .home-search.open{grid-template-rows:1fr;margin-top:12px;}
  .home-search.open .search{opacity:1;transform:none;}
  .search{display:flex;align-items:center;gap:9px;height:36px;margin:1px;padding:0 15px;border:1px solid var(--grey-400);border-radius:75px;background:#fff;transition:border-color .2s ease;}
  .search:focus-within{border-color:var(--blue-300);}
  .search svg{width:22px;height:22px;color:var(--grey-800);flex-shrink:0;}
  .search input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font:500 14px var(--font);color:var(--grey-800);}
  .search input::placeholder{color:var(--grey-600);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search kbd{font:500 12px/12px var(--font);color:var(--grey-500);padding:3px 6px;border-radius:6px;background:var(--grey-100);}
  /* One line that scrolls sideways; runs to the screen edges so the overflow reads as scrollable */
  .home .tags{margin:8px calc(var(--gutter) * -1) -4px;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:4px var(--gutter);scroll-padding:0 var(--gutter);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .home .tags::-webkit-scrollbar{display:none;}
  .tag:active{transform:scale(.96);}

  .feedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px;}
  .feedgrid>.cardwrap,.feedgrid>.sk-card{background:#fff;border:1px solid transparent;border-radius:24px;}
  .feedgrid>.cardwrap{transition:transform .45s cubic-bezier(.16,1,.3,1),border-color .45s cubic-bezier(.16,1,.3,1);animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 60ms);}
  .feedgrid>.cardwrap:hover{transform:translateY(-2px);border-color:var(--grey-200);}
  /* Cards in a row share one height: pin the progress bar and footer to the bottom so they line up */
  .feedgrid>.cardwrap{display:flex;flex-direction:column;}
  .feedgrid .card-content{flex:1;}
  .feedgrid .ctitle{min-height:0;}
  .feedgrid .progress-group{margin-top:auto;}
  .feedgrid .view-btn{transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .feedgrid .view-btn:active{transform:scale(.96);}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.feedgrid>.cardwrap{animation:none;}}

  /* ================= Wallet stack ================= */
  .w-stack{background:var(--grey-800);display:flex;flex-direction:column;align-items:center;}
  .w-today{background:var(--grey-50);width:100%;display:flex;gap:9px;align-items:center;justify-content:center;padding:6px 18px;border-bottom-left-radius:15px;border-bottom-right-radius:15px;}
  .w-today-txt{display:flex;gap:3px;align-items:center;font-size:14px;color:#000;}
  .w-today-txt b{font-weight:600;}
  .w-big{padding:30px 0;text-align:center;color:#fff;}
  .w-big .a{font-size:28px;font-weight:600;line-height:34px;}
  .w-big .s{font-size:14px;font-weight:500;line-height:20px;margin-top:3px;}
  .w-actions{background:var(--grey-50);width:100%;display:flex;gap:9px;padding:18px 12px 12px;border-top-left-radius:15px;border-top-right-radius:15px;}
  .w-actions .btn-secondary{flex:1;width:auto;}
  .w-recent{display:flex;flex-direction:column;gap:12px;}
  .w-daybar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;}
  .w-daybar .day{font-size:14px;font-weight:600;line-height:16px;color:var(--grey-500);}
  .w-daybar svg{width:24px;height:24px;}
  .w-txn{display:flex;flex-direction:column;gap:9px;}
  .w-txn .item{display:flex;gap:9px;align-items:flex-start;padding:0 12px;}
  .w-txn .logo{width:24px;height:24px;border-radius:15px;object-fit:cover;flex-shrink:0;background:#fff;}
  .w-txn .c{flex:1;display:flex;flex-direction:column;gap:6px;}
  .w-txn .desc{font-size:14px;line-height:20px;color:var(--grey-800);}
  .w-txn .desc b{font-weight:600;}
  .w-txn .time{display:flex;gap:6px;align-items:center;}
  .w-txn .time .ago{font-size:12px;line-height:16px;color:var(--grey-600);}
  .w-txn .time svg{width:16px;height:16px;color:var(--earn);}
  .w-divider{height:1px;background:var(--grey-100);margin:3px 9px;}
  .wallet{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:36px;align-items:start;}
  .wallet .w-stack{position:sticky;top:calc(var(--header) + 16px);}
  .wallet .w-recent{max-width:480px;}

  /* ================= My work ================= */
  .mw-layout{display:flex;flex-direction:column;gap:36px;}
  /* Dark only behind the lower half so the sheet's top corners stay clean */
  .mw-rail{border-radius:21px;overflow:hidden;background:linear-gradient(transparent 50%,var(--grey-800) 50%);}
  .mw-rail .sheet-b{border-radius:21px;}
  .mw-rail .mw-sheet{padding:12px 0 18px;}  /* keeps 'Ongoing' in line with the section headings below */
  .mw-main{display:flex;flex-direction:column;gap:36px;min-width:0;}
  .mw-logos{display:grid;grid-template-columns:repeat(4,minmax(0,54px));gap:9px;padding:0 12px;}
  .mw-logo72{width:100%;aspect-ratio:1;border-radius:75px;border:1px solid var(--grey-200);overflow:hidden;flex-shrink:0;cursor:pointer;background:#fff;transition:transform .3s cubic-bezier(.16,1,.3,1);}
  .mw-logo72:hover{transform:translateY(-2px);}
  .mw-logo72:active{transform:scale(.96);}
  .mw-logo72 img{width:100%;height:100%;object-fit:cover;}

  .mw-card-bot{display:flex;align-items:flex-end;justify-content:space-between;width:100%;}

  /* Heading + tags match the Campaigns (explore) heading */
  .mw-home #mw-body{margin-top:24px;}

  /* ================= Campaign page ================= */
  .cp{display:grid;grid-template-columns:minmax(0,1fr);column-gap:24px;row-gap:0;align-items:start;margin:-18px 0 -60px;}
  /* Main column sits between two full-height divider lines (top bar + content) */
  .cp-top,.cp-main{border-left:1px solid var(--grey-200);border-right:1px solid var(--grey-200);padding-left:18px;padding-right:18px;}
  .cp-main{padding-bottom:60px;}
  .cp-main{display:flex;flex-direction:column;min-width:0;}
  .cp-hero{position:relative;aspect-ratio:519/225;border-radius:15px;background:var(--grey-200);}
  .cp-brandpill{position:absolute;z-index:1;left:20px;bottom:-38px;width:76px;height:76px;border-radius:75px;border:5px solid #fff;overflow:hidden;background:#fff;}
  .cp-brandpill img{width:100%;height:100%;object-fit:cover;display:block;}
  .cp-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:inherit;}
  /* Top bar above the main image: back link on the left, like + share on the right */
  .cp-top{grid-row:1;grid-column:1;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:12px;}
  .cp>:not(.cp-top){grid-row:2;}
  .cp-back{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 0;font-size:14px;font-weight:500;line-height:19px;color:var(--grey-600);transition:color .2s ease;}
  .cp-back svg{width:20px;height:20px;transition:transform .25s cubic-bezier(.16,1,.3,1);}
  .cp-back:hover{color:var(--grey-800);}
  .cp-back:hover svg{transform:translateX(-2px);}
  .cp-actions{display:flex;gap:8px;align-items:center;}
  .cp-hero .cp-actions{position:absolute;z-index:1;top:12px;right:12px;}
  .cp-hero .cp-round{width:36px;height:36px;border:0;box-shadow:0 2px 6px rgba(0,0,0,.16);}
  .cp-hero .cp-round:hover{background:var(--grey-100);}
  .cp-round{width:30px;height:30px;border-radius:75px;background:#fff;border:1px solid var(--grey-200);display:flex;align-items:center;justify-content:center;color:var(--grey-800);transition:background .2s ease,border-color .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .cp-round svg{width:20px;height:20px;}
  .cp-round:hover{background:var(--grey-100);border-color:var(--grey-400);}
  .cp-round:active{transform:scale(.94);}
  .cp-details{display:flex;flex-direction:column;gap:8px;padding:52px 0 0;}
  .cp-title{font-size:22px;font-weight:600;line-height:26px;letter-spacing:-.02em;color:var(--grey-800);}
  .cp-details>.cp-list{margin-top:16px;padding:12px 16px;border:1px solid var(--grey-200);border-radius:15px;}
  .cp-joined{display:flex;gap:6px;align-items:center;background:var(--grey-100);padding:3px 12px 3px 3px;border-radius:75px;}
  .cp-avatars{display:flex;}
  .cp-avatars img{width:22px;height:22px;border-radius:15px;border:1.5px solid var(--grey-50);object-fit:cover;margin-left:-6px;background:#ddd;}
  .cp-avatars img:first-child{margin-left:0;}
  .cp-joined .count{font-size:14px;font-weight:500;color:var(--grey-600);}
  .cp-infotags{padding:18px 8px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .cp-infotags h3{font-size:15px;font-weight:600;line-height:19px;color:var(--grey-800);text-align:center;}
  .cp-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;}
  .cp-tag{background:var(--grey-100);display:flex;gap:4px;align-items:center;justify-content:center;padding:6px 12px 6px 8px;border-radius:75px;}
  .cp-tag svg{width:16px;height:16px;color:var(--grey-800);}
  .cp-tag span{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);}
  .cp-event{display:flex;justify-content:center;padding:12px 18px;}
  .cp-event-card{display:flex;flex-direction:column;gap:9px;align-items:center;padding:12px 15px;}
  .cp-event-info{display:flex;flex-direction:column;align-items:center;}
  .cp-event-info .line{font-size:18px;font-weight:600;line-height:22px;color:var(--grey-50);text-align:center;}
  .cp-event-info .mut{color:var(--grey-500);}
  .cp-event-row{display:flex;gap:6px;align-items:center;justify-content:center;}
  .cp-event-ic{width:24px;height:24px;flex-shrink:0;color:var(--grey-50);}
  .cp-event-ic svg{width:24px;height:24px;}
  .cp-event-cta{display:flex;flex-direction:column;align-items:center;}
  .cp-event-cta .lbl{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-500);}
  .cp-event-link{display:flex;gap:3px;align-items:center;cursor:pointer;}
  .cp-event-link span{font-size:14px;font-weight:500;line-height:20px;color:var(--blue-300);}
  .cp-event-link .ext{width:16px;height:16px;color:var(--blue-300);}
  .cp-event-link .ext svg{width:16px;height:16px;}
  .cp-reqs{padding:24px 18px 12px;display:flex;flex-direction:column;gap:9px;}
  .cp-reqs h3,.cp-createdby>h3,.cp-main>div:not(.band)>.cp-infotags h3{font-size:16px;font-weight:600;line-height:22px;color:var(--grey-800);}
  .cp-reqs{gap:24px;}
  .cp-sec{display:flex;flex-direction:column;gap:12px;}
  .cp-reqs p{font-size:14px;line-height:20px;color:var(--grey-800);max-width:480px;}
  .cp-reqs h4{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);margin-top:12px;}
  .cp-spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .cp-spectile{background:#fff;border:1px solid var(--grey-200);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;}
  .cp-spectile .k{font-size:12px;font-weight:500;line-height:16px;color:var(--grey-600);}
  .cp-spectile .v{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .cp-plats{display:flex;flex-wrap:wrap;gap:8px;}
  .cp-plat{display:flex;gap:6px;align-items:center;padding:6px 12px;border-radius:75px;background:#fff;border:1px solid var(--grey-200);font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);}
  .cp-plat svg{width:16px;height:16px;}
  .cp-ctas{background:var(--blue-100);border-left:2px solid var(--blue-500);border-radius:0 12px 12px 0;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
  .cp-ctas p{font-style:italic;color:var(--grey-800);}
  .cp-restrict{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:8px;}
  .cp-restrict li{counter-increment:r;display:flex;gap:12px;align-items:center;font-size:14px;line-height:20px;color:var(--grey-800);}
  .cp-restrict li::before{content:counter(r);width:24px;height:24px;flex-shrink:0;border-radius:75px;background:var(--grey-100);border:1px solid var(--grey-200);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--grey-600);}
  .cp-meta{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-600);}
  .cp-mi{display:flex;gap:8px;align-items:center;white-space:nowrap;}
  .cp-mi svg{width:16px;height:16px;}
  .cp-mi .dot{width:4px;height:4px;border-radius:4px;background:var(--grey-400);flex-shrink:0;}
  .cp-meta .vsep{width:1px;height:14px;background:var(--grey-400);flex-shrink:0;}
  .cp-budgetline{margin-top:8px;font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-createdby{display:flex;flex-direction:column;gap:12px;padding:24px 0 0;}
  .cp-join{padding-top:24px;}
  .cp-join .btn-primary{padding:12px 16px;font-size:16px;font-weight:600;line-height:24px;}
  .cp-main>div:not(.band)>.cp-reqs{padding-left:0;padding-right:0;}
  .cp-main>div:not(.band)>.cp-infotags{padding:24px 0 0;align-items:flex-start;}
  .cp-main>div:not(.band)>.cp-infotags .cp-tags{justify-content:flex-start;}
  .cp-main>div:not(.band)>.cp-reqs{padding-top:24px;padding-bottom:0;}
  .cp-creatorcard{filter:none;border:1px solid var(--grey-200);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:16px;}
  .cp-creatorcard .col{display:flex;flex-direction:column;gap:16px;}
  .cp-identity{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:8px;}
  .cp-identity .av{width:48px;height:48px;border-radius:75px;object-fit:cover;background:#fff;}
  .cp-idtext{display:flex;flex-direction:column;gap:4px;align-items:center;}
  .cp-identity .name{font-size:16px;font-weight:600;line-height:22px;color:var(--grey-800);}
  .cp-identity .since{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-cdesc{font-size:14px;line-height:20px;color:var(--grey-800);text-align:center;}
  .cp-stats{display:flex;align-items:center;justify-content:center;padding:8px 0;}
  .cp-stat{display:flex;flex-direction:column;align-items:center;flex:1;}
  .cp-stat .big{font-size:16px;font-weight:600;line-height:22px;color:var(--grey-800);}
  .cp-stat .lbl{font-size:12px;font-weight:500;line-height:16px;color:var(--grey-600);}
  .cp-stat-div{width:1px;height:32px;background:var(--grey-200);}
  .handles{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .handle{display:flex;flex-direction:column;gap:4px;align-items:center;padding:4px;position:relative;flex-shrink:0;}
  .handle .pf{width:48px;height:48px;border-radius:75px;object-fit:cover;background:#fff;}
  .handle .badge{position:absolute;left:39px;top:0;background:#fff;padding:5px;border-radius:15px;display:flex;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));color:#121212;}
  .handle .badge svg{width:12px;height:12px;}
  .handle .fc{font-size:12px;font-weight:500;line-height:16px;color:var(--grey-800);}
  .cp-questions{margin-top:auto;}
  .cp-questions .btn-questions{border-radius:75px;box-shadow:none;}

  .cp-status{margin-top:18px;}
  /* Same frame as the brand web app's campaign dashboard: 296px left column (Explore more),
     24px gap, campaign details in the larger column. Explore more hides below 1024px. */
  .cp-similar{display:none;}
  @media (min-width:1024px){
    .cp{grid-template-columns:296px minmax(0,1fr);}
    .cp-top{grid-column:2;}
    .cp>.cp-similar{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;gap:9px;position:sticky;top:var(--header);max-height:calc(100dvh - var(--header));overflow-y:auto;overscroll-behavior:contain;padding-right:6px;margin-right:-16px;padding-bottom:6px;
      scrollbar-width:thin;scrollbar-color:var(--grey-400) transparent;scrollbar-gutter:stable;}
    .cp>.cp-similar h3{padding-top:21px;margin-bottom:-3px;}
    .cp-similar::-webkit-scrollbar{width:6px;}
    .cp-similar::-webkit-scrollbar-track{background:transparent;}
    .cp-similar::-webkit-scrollbar-thumb{background:var(--grey-400);border-radius:75px;}
    .cp-similar::-webkit-scrollbar-thumb:hover{background:var(--grey-600);}
  }
  .cp-similar h3{font-size:18px;font-weight:600;line-height:22px;color:var(--grey-800);padding:3px 3px 3px;}
  /* Same campaign card as the explore feed, scaled down for the column */
  .sim-list{display:flex;flex-direction:column;gap:12px;}
  .cp-similar .cardwrap{padding:6px;flex-shrink:0;background:#fff;border:1px solid transparent;border-radius:18px;transition:transform .45s cubic-bezier(.16,1,.3,1),border-color .45s cubic-bezier(.16,1,.3,1);}
  .cp-similar .cardwrap:hover{transform:translateY(-2px);border-color:var(--grey-200);}
  .cp-similar .card-img{height:164px;border-radius:12px;}
  .cp-similar .card-logobar{padding:9px;}
  .cp-similar .card-logobar .logo{width:21px;height:21px;}
  .cp-similar .heart{width:20px;height:20px;}
  .cp-similar .overlaybar{height:36px;padding:0 8px 0 11px;}
  .cp-similar .overlaybar::before{border-radius:12px;}
  .cp-similar .details{gap:4px;}
  .cp-similar .details svg{width:12px;height:12px;}
  .cp-similar .price-chip{font-size:11px;line-height:11px;padding:2px 5px;}
  .cp-similar .view-btn{padding:5px 11px;font-size:12px;line-height:16px;}
  .cp-similar .card-content{gap:5px;padding:8px 6px 6px;}
  .cp-similar .card-content .ctitle{font-size:14px;line-height:18px;}
  .cp-similar .card-time{font-size:11px;line-height:11px;}

  .sim-all{flex-shrink:0;text-align:center;padding:9px;border-radius:75px;background:var(--grey-100);font-size:14px;font-weight:500;color:var(--grey-800);transition:background .25s ease;}
  .sim-all:hover{background:var(--grey-200);}
  /* status card (Ongoing / Pending approval / Completed) */
  .sbo-green{background:var(--ongoing);border-radius:15px;width:100%;display:flex;flex-direction:column;}
  .sbo-green.pending{background:var(--pending);}
  .sbo-green.completed{background:var(--blue-500);}
  .sbo-green-label{text-align:center;padding:3px 0;font-size:12px;font-weight:500;color:#fff;}

  .sbo-earn .amt{font-size:20px;font-weight:600;line-height:27px;}

  .sbo-earndetails{width:100%;padding:3px 0 0;display:flex;flex-direction:column;gap:6px;}

  .pf-smhandles{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .addhandle{display:flex;flex-direction:column;gap:3px;align-items:center;padding:6px;flex-shrink:0;cursor:pointer;}
  .addhandle .circle{width:48px;height:48px;border-radius:75px;background:#fff;border:1px dashed var(--grey-500);display:flex;align-items:center;justify-content:center;color:var(--grey-500);}
  .addhandle.solid .circle{border:1px solid var(--grey-200);}
  .addhandle .circle svg{width:20px;height:20px;}
  .addhandle span{font-size:14px;font-weight:500;color:#121212;}
  .vline{width:1px;height:54px;background:var(--grey-200);flex-shrink:0;}
  .pf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  .pf-grid img{width:100%;aspect-ratio:115/174;object-fit:cover;border-radius:9px;background:#ddd;}

  /* ================= Settings ================= */
  .settings{display:grid;grid-template-columns:165px minmax(0,420px);gap:36px;align-items:start;}
  .set-nav{position:sticky;top:calc(var(--header) + 16px);}
  .set-block{position:relative;display:flex;flex-direction:column;gap:3px;padding:12px 0;scroll-margin-top:calc(var(--header) + 12px);}
  .set-block+.set-block::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:var(--grey-200);}
  .set-blocktitle{padding:0 12px;font-size:15px;font-weight:600;line-height:19px;color:#000;}
  .set-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;cursor:pointer;}
  .set-row:hover{background:var(--grey-100);}
  .set-ic{width:22px;height:22px;color:var(--grey-700);flex-shrink:0;display:flex;}
  .set-ic svg{width:22px;height:22px;}
  .set-av{width:27px;height:27px;border-radius:75px;object-fit:cover;flex-shrink:0;margin:-3px 0;background:#fff;}
  .set-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .set-lbl{font-size:14px;font-weight:500;line-height:18px;color:var(--grey-800);}
  .set-row>.set-lbl{flex:1;}
  .set-sub{font-size:12px;font-weight:400;line-height:15px;color:var(--grey-600);}
  .set-val{font-size:14px;font-weight:500;color:var(--grey-600);flex-shrink:0;}
  .set-chev{width:20px;height:20px;color:var(--grey-500);flex-shrink:0;display:flex;}
  .set-chev svg{width:20px;height:20px;}
  .set-row.danger .set-lbl,.set-row.danger .set-ic{color:var(--pink-500);}
  .tg{width:33px;height:20px;border-radius:75px;background:var(--grey-400);position:relative;flex-shrink:0;cursor:pointer;transition:background .22s ease;}
  .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:75px;background:#fff;transition:transform .22s cubic-bezier(.16,1,.3,1);box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .tg.on{background:var(--blue-500);}
  .tg.on::after{transform:translateX(14px);}
  .set-version{font-size:12px;color:var(--grey-500);padding:18px 12px 0;}

  /* ================= Submit content ================= */
  .backbar{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:8px;margin:0 0 12px -8px;border-radius:999px;cursor:pointer;transition:background .15s;}
  .backbar:hover{background:var(--grey-100,#f2f2f2);}
  .backbar svg{width:24px;height:24px;color:var(--grey-800);}
  /* Single column: the form only, no campaign summary beside it */
  .submit{display:flex;flex-direction:column;max-width:720px;margin:0 auto;}
  .sc-main{display:flex;flex-direction:column;min-width:0;}
  .sc-content{display:flex;flex-direction:column;gap:24px;min-width:0;}
  .sc-titlecard{display:flex;flex-direction:column;gap:9px;}
  .sc-h1{font-size:20px;font-weight:600;line-height:27px;color:#121212;}
  .sc-desc,.sc-sub{font-size:14px;line-height:20px;color:#717171;}
  .sc-section{display:flex;flex-direction:column;gap:9px;}
  .sc-h2{font-size:15px;font-weight:600;line-height:19px;color:#121212;}
  .sc-handles{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .sc-dropzone{background:#fff;border:1px solid var(--grey-200);border-radius:9px;padding:48px 0;display:flex;flex-direction:column;gap:9px;align-items:center;cursor:pointer;transition:border-color .2s ease;}
  .sc-dropzone:hover,.sc-dropzone.over{border-color:var(--blue-300);}
  .sc-uploadicon{width:36px;height:36px;border-radius:75px;background:#ececec;display:flex;align-items:center;justify-content:center;color:#717171;}
  .sc-uploadicon svg{width:20px;height:20px;}
  .sc-dropzone.has .sc-uploadicon{background:var(--blue-100);color:var(--blue-500);}
  .sc-droptext{display:flex;flex-direction:column;gap:2px;align-items:center;}
  .sc-droptext .t1{font-size:14px;font-weight:500;color:#121212;}
  .sc-droptext .t2{font-size:14px;line-height:20px;color:#717171;text-align:center;}
  .sc-links{display:flex;flex-direction:column;gap:12px;margin-top:3px;}
  .sc-linkgroup{display:flex;flex-direction:column;gap:6px;}
  .sc-linkgroup .lbl{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .sc-link{display:flex;align-items:center;gap:9px;height:39px;padding:0 12px;border:1px solid var(--grey-200);border-radius:9px;background:#fff;color:var(--grey-700);transition:border-color .2s ease,box-shadow .2s ease;}
  .sc-link>svg{width:18px;height:18px;flex-shrink:0;}
  .sc-link:focus-within{border-color:var(--blue-300);box-shadow:0 0 0 2px var(--blue-100);}
  .sc-linkinput{flex:1;min-width:0;border:0;outline:none;background:none;font:400 14px/20px var(--font);color:var(--grey-800);}
  .sc-linkinput::placeholder{color:var(--grey-500);}
  .sc-linkgroup .err{display:none;font-size:12px;line-height:16px;color:var(--pink-500);}
  .sc-linkgroup.bad .sc-link,#g-links.none .sc-link{border-color:var(--pink-500);}
  .sc-linkgroup.bad .err{display:block;}
  .sc-terms{display:flex;gap:9px;align-items:flex-start;cursor:pointer;}
  .sc-check{color:var(--grey-400);display:flex;flex-shrink:0;}
  .sc-terms.on .sc-check{color:#1548eb;}
  .sc-terms.bad .sc-check{color:var(--pink-500);}
  .sc-check svg{width:24px;height:24px;}
  .sc-terms p{font-size:14px;font-weight:500;line-height:20px;color:#717171;flex:1;}
  .sc-terms .link{color:#1548eb;}
  .sc-foot{display:flex;flex-direction:column;gap:6px;}
  .sc-foot .msg{font-size:12px;line-height:16px;color:var(--pink-500);text-align:center;min-height:16px;}

  /* ================= Notifications page ================= */
  .notifs{max-width:640px;}
  .nt-list{display:flex;flex-direction:column;gap:12px;}
  .nt-item{display:flex;gap:9px;align-items:flex-start;}
  .nt-logo{width:24px;height:24px;border-radius:15px;object-fit:cover;flex-shrink:0;background:var(--grey-100);}
  .nt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--grey-200);}
  .nt-item:last-child .nt-body{border-bottom:none;padding-bottom:0;}
  .nt-text{font-size:14px;line-height:20px;color:var(--grey-800);font-weight:600;}
  .nt-text .med{font-weight:500;}
  .nt-time{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}

  /* ================= Overlays (mobile sheets, centred on desktop) ================= */
  .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;}
  .overlay.open{display:flex;}
  .ov-scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:scrimIn .4s ease both;}
  @keyframes scrimIn{from{opacity:0;}to{opacity:1;}}
  @keyframes sheetIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:none;}}
  .cf-sheet,.ov-sheet{position:relative;width:100%;max-width:315px;background:#fff;border-radius:21px;display:flex;flex-direction:column;align-items:center;animation:sheetIn .5s cubic-bezier(.16,1,.3,1) both;}
  .cf-sheet{padding:21px 21px 24px;gap:15px;}
  .cf-ic{width:42px;height:42px;border-radius:75px;display:flex;align-items:center;justify-content:center;}
  .cf-ic.warn{background:rgba(244,51,171,.12);color:var(--pink-500);}
  .cf-ic.neutral{background:var(--grey-100);color:var(--grey-700);}
  .cf-ic svg{width:21px;height:21px;}
  .cf-text{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;}
  .cf-text h3{font-size:16px;font-weight:600;line-height:21px;color:var(--grey-800);}
  .cf-text p{font-size:14px;line-height:20px;color:var(--grey-600);}
  .cf-actions{display:flex;flex-direction:column;gap:8px;width:100%;}
  .cf-btn{border-radius:75px;padding:11px 15px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;}
  .cf-btn.danger{background:var(--pink-500);color:#fff;box-shadow:2px 2px 5px rgba(0,0,0,.08);}
  .cf-btn.dark{background:var(--grey-800);color:var(--grey-50);box-shadow:2px 2px 5px rgba(0,0,0,.08);}
  .cf-btn.ghost{background:var(--grey-100);color:var(--grey-800);}
  .ov-sheet{padding:36px;gap:21px;}
  .ov-graphic{width:101px;height:101px;border-radius:26px;background:var(--pending-card);box-shadow:2px 3px 9px rgba(0,0,0,.3);position:relative;overflow:hidden;flex-shrink:0;}
  .ov-graphic .thumb{position:absolute;width:44px;height:56px;border-radius:6px;object-fit:cover;box-shadow:2px 3px 6px rgba(0,0,0,.3);}
  .ov-graphic .t1{left:14px;top:10px;transform:rotate(-3deg);}
  .ov-graphic .t2{right:12px;top:18px;transform:rotate(4deg);}
  .ov-graphic .glow{position:absolute;bottom:0;left:0;right:0;height:68px;background:radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.45),transparent 65%);}
  .ov-graphic .label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);text-align:center;color:#fff;font-size:12px;font-weight:500;line-height:1.15;}
  .ov-text{display:flex;flex-direction:column;gap:24px;align-items:center;width:100%;padding:8px 0;}
  .ov-title{font-size:18px;font-weight:600;line-height:22px;color:var(--grey-800);text-align:center;}
  .ov-title .purple{color:var(--pending-card);}
  .ov-primary{background:var(--grey-800);color:var(--grey-50);border-radius:75px;padding:9px 15px;width:100%;text-align:center;font-size:14px;font-weight:500;cursor:pointer;box-shadow:2px 2px 5px rgba(0,0,0,.08);}

  /* ================= Campaign drawer (slides in from the right on Campaigns) ================= */
  .cdrawer{position:fixed;inset:0;z-index:40;}
  .cdrawer[hidden]{display:none;}
  .cd-scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .35s ease;}
  .cd-panel{position:absolute;top:0;right:0;bottom:0;width:min(760px,calc(100% - 64px));background:var(--grey-50);display:flex;flex-direction:column;
    box-shadow:-8px 0 32px rgba(0,0,0,.16);transform:translateX(100%);transition:transform .45s cubic-bezier(.16,1,.3,1);outline:none;}
  .cdrawer.open .cd-scrim{opacity:1;}
  .cdrawer.open .cd-panel{transform:none;}
  .cd-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 24px;background:#fff;border-bottom:1px solid var(--grey-200);}
  .cd-back{display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-left:-8px;border-radius:75px;color:var(--grey-800);transition:background .2s ease;}
  .cd-back:hover{background:var(--grey-100);}
  .cd-back svg,.cd-open svg{width:22px;height:22px;}
  .cd-open{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-right:-12px;border-radius:75px;font-size:14px;font-weight:600;line-height:20px;color:var(--blue-500);transition:background .2s ease;}
  .cd-open:hover{background:var(--grey-100);}
  .cd-body{flex:1;overflow-y:auto;overscroll-behavior:contain;}
  /* Details only (drawer and the "open in a new window" page): no Explore more column; the drawer also drops the back link */
  .cp.cp-solo{grid-template-columns:minmax(0,1fr);margin:0;}
  .cp-solo .cp-top{grid-column:1;padding-top:12px;}
  .cd-body .cp-main{padding-top:24px;}
  .cp-solo .cp-top,.cp-solo .cp-main{border:0;padding-left:24px;padding-right:24px;}
  .cp-solo .cp-main{padding-bottom:32px;}
  #view .cp.cp-solo{max-width:760px;margin:0 auto;}
  #view .cp-solo .cp-top,#view .cp-solo .cp-main{padding-left:0;padding-right:0;}
  body.cdrawer-open{overflow:hidden;}
  @media(prefers-reduced-motion:reduce){.cd-scrim,.cd-panel{transition:none;}}

  .toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--grey-800);color:var(--grey-50);
    padding:9px 15px;border-radius:75px;font-size:14px;font-weight:500;box-shadow:2px 2px 9px rgba(0,0,0,.16);transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1);}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ================= Responsive ================= */
  @media (max-width:1279px){
    .feedgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:1023px){
    :root{--gutter:18px;}
    .wallet,.profile,.settings{grid-template-columns:minmax(0,1fr);}
    .wallet .w-stack,.pf-left,.set-nav{position:static;}
    .cp{margin-bottom:0;}
    .cp-main{padding-bottom:24px;}
    /* No Explore more column here, so drop the divider lines and their inset */
    .cp-top,.cp-main{border-left:0;border-right:0;padding-left:0;padding-right:0;}
    .cp-creatorcard{grid-template-columns:minmax(0,1fr);}
    .pf-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width:767px){
    :root{--gutter:12px;}
    /* Phone top bar: menu | balance pill (centred) | search, bell, avatar */
    .topbar{grid-template-columns:40px minmax(0,1fr) auto;gap:4px;}
    .brand,.tnav{display:none;}
    .menu-btn{display:flex;grid-column:1;}
    .top-right{gap:4px;}
    /* Pill sits in the true centre of the bar, independent of the side widths */
    .wallet-pill{position:absolute;inset:0;margin:auto;width:fit-content;height:28px;padding:0 12px;}
    .top-right .hicon{background:none;border:0;}
    .top-right .hicon.on{background:var(--grey-800);}
    .top-av{width:28px;height:28px;margin-left:4px;}
    .drawer-scrim{display:block;position:fixed;top:var(--header);left:0;right:0;bottom:0;z-index:19;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s ease;}
    body.drawer-open .drawer-scrim{opacity:1;pointer-events:auto;}
    .drawer{display:block;position:fixed;top:var(--header);left:0;bottom:0;width:min(80%,320px);z-index:19;background:var(--grey-50);padding:24px 8px;
      transform:translateX(-100%);visibility:hidden;transition:transform .45s cubic-bezier(.16,1,.3,1),visibility 0s linear .45s;}
    .drawer.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.16,1,.3,1),visibility 0s;}
    body.drawer-open{overflow:hidden;}
    .feedgrid{grid-template-columns:minmax(0,1fr);gap:12px;margin-top:18px;}
    /* Card image sits on the 12px gutter: drop the invisible wrapper's side inset */
    .feedgrid>.cardwrap,.feedgrid>.sk-card{padding-left:0;padding-right:0;border-width:0;}
    .mw-list{grid-template-columns:minmax(0,1fr);}
    .cp-hero{height:180px;}
    .cp-spec{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <button class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="drawer"></button>
  <a class="brand" href="#/explore" aria-label="UGC Platform home"><svg viewBox="0 0 269 184" fill="none" aria-hidden="true"><path d="M121.556 4.06404C141.556 -7.48297 166.556 6.9505 166.556 30.0445C166.556 31.0921 165.899 32.0212 164.936 32.4319C152.062 37.9179 143.037 50.6867 143.037 65.564V116.564C143.037 131.086 151.636 143.598 164.02 149.29C165.519 149.979 166.556 151.435 166.556 153.085C166.555 176.178 141.556 190.612 121.556 179.065L15 117.545C-5 105.998 -5 77.1306 15 65.5836L121.556 4.06404Z" fill="currentColor"/><path d="M227.969 0.278931C250.418 0.27893 268.617 18.478 268.617 40.9274V140.409C268.617 162.858 250.418 181.056 227.969 181.056C210.666 181.056 195.891 170.245 190.025 155.01C189.233 152.955 190.505 150.769 192.546 149.942C205.734 144.6 215.037 131.669 215.037 116.564V65.5641C215.037 50.3684 205.621 37.3734 192.306 32.0911C190.279 31.2867 188.994 29.1414 189.737 27.0903C195.397 11.453 210.378 0.278951 227.969 0.278931Z" fill="currentColor"/></svg></a>
  <nav class="tnav" id="tnav" aria-label="Main"></nav>
  <div class="top-right">
    <a class="wallet-pill" href="#/wallet" aria-label="Wallet balance"><span>Rs. 12,688</span></a>
    <button class="hicon" id="search-btn" data-search aria-label="Search" aria-expanded="false"></button>
    <a class="hicon" id="bell-btn" href="#/notifications" aria-label="Notifications"><span id="bell-ic"></span><i class="dot" id="bell-dot"></i></a>
    <a href="#/profile" aria-label="Profile"><img class="top-av" data-a="pfAvatar" data-label="R" alt=""></a>
  </div>
</header>
<main class="content" id="view"></main>
<div class="drawer-scrim" id="drawer-scrim"></div>
<nav class="drawer" id="drawer" aria-label="Main" aria-hidden="true"><div class="menu-list" id="drawer-list"></div></nav>

<div class="overlay" id="overlay"><div class="ov-scrim" data-close></div><div id="overlay-sheet"></div></div>
<div class="cdrawer" id="cdrawer" hidden>
  <div class="cd-scrim" data-cdrawer-close></div>
  <aside class="cd-panel" id="cd-panel" role="dialog" aria-modal="true" aria-label="Campaign details" tabindex="-1">
    <div class="cd-bar">
      <button class="cd-back" type="button" data-cdrawer-close aria-label="Back to campaigns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
      <a class="cd-open" id="cd-open" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg><span>Open campaign in a new window</span></a>
    </div>
    <div class="cd-body" id="cd-body"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/jpeg,image/png,video/mp4" hidden>

<script>
/* ===== Design assets injected from the mobile prototype by desktop/build.js ===== */
/*@ASSETS@*/

/*@ICON@*/

A.kfcLogo=A.kfcLogo||'data:image/svg+xml;base64,'+btoa(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' fill='#e4002b'/><text x='50%' y='53%' font-family='Inter,Arial,sans-serif' font-size='36' font-weight='600' fill='#fff' text-anchor='middle' dominant-baseline='middle'>KFC</text></svg>`);

function fallback(img){
  const label=(img.dataset.label||"?").slice(0,2).toUpperCase();
  const c=['#1548eb','#f433ab','#717171','#121212'][label.charCodeAt(0)%4];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='${c}'/><text x='50%' y='54%' font-family='Inter,sans-serif' font-size='26' font-weight='600' fill='white' text-anchor='middle' dominant-baseline='middle'>${label}</text></svg>`;
  img.src='data:image/svg+xml;base64,'+btoa(svg);
}
function bindAssets(root){
  root.querySelectorAll('img[data-a]').forEach(img=>{
    if(img.dataset.bound) return; img.dataset.bound=1;
    img.onerror=()=>{img.onerror=null;fallback(img);};
    if(A[img.dataset.a]) img.src=A[img.dataset.a]; else fallback(img);
  });
}
const AVSET='<img data-a="av1" data-label="C" alt=""><img data-a="av2" data-label="C" alt=""><img data-a="av3" data-label="C" alt=""><img data-a="av4" data-label="C" alt="">';

function cardHTML(id,opt={}){
  const c=C[id], pending=opt.pending||c.status==='pending', go=opt.go||`#/campaign/${id}`;
  const open=opt.drawer?`data-cdrawer="${id}"`:`data-go="${go}"`;
  return `<div class="cardwrap">${pending?'<div class="pending-card">':''}<div class="card-img" ${open}>
      <img class="photo" data-a="${c.img}" data-label="${c.abbr}" alt="">
      <div class="card-logobar"><img class="logo" data-a="${c.logo}" data-label="${c.abbr}" alt="">${ICON.heart}</div>

    <div class="card-content">
      <div class="ctitle" ${open}>${c.title}</div>${timeHTML(c)}
      <div class="progress-group"><div class="progress"><div class="fill" style="width:${c.progress}%"></div></div>
        <div class="card-foot">${c.joined?`<div class="joined">${ICON.user}<span>${c.joined}</span></div>`:'<span></span>'}<div class="money">${c.money}</div></div></div>

}

    <div class="feedgrid" id="feed"></div>
  </div>`;

function renderFeed(){
  const f=document.getElementById('feed'); if(!f) return;
  if(!state.loaded){
    f.innerHTML=Array.from({length:6},()=>`<div class="sk-card"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>`).join('');
    setTimeout(()=>{state.loaded=true;renderFeed();},600);return;
  }
  const q=state.q.trim().toLowerCase();
  let ids=EXPLORE.filter(id=>{const c=C[id];
    if(!['All','Price'].includes(state.cat)&&c.cat!==state.cat) return false;
    return !q||(c.title+' '+c.brand).toLowerCase().includes(q);});
  if(state.cat==='Price') ids=[...ids].sort((a,b)=>C[b].budgetN-C[a].budgetN);
  f.innerHTML=ids.length?ids.map((id,i)=>cardHTML(id,{drawer:true}).replace('class="cardwrap"',`class="cardwrap" style="--i:${i}"`)).join('')
    :`<div class="ph"><div class="tag2">No campaigns</div><h2>Nothing matches “${esc(state.q||state.cat)}”</h2><p>Try another brand name or clear the search to see every open campaign.</p><div class="tag" data-act="clear">Clear filters</div></div>`;
  bindAssets(f);
}

/* ================= Router ================= */
const view=document.getElementById('view');
// Each history entry carries its position, so in-app back can use the browser's own
// history (staying in sync with the browser back/forward buttons).
let navIdx=-1,replacing=false;
// Swap the current entry instead of adding one (back then skips it).
function replaceHash(h){ if(location.hash===h) return; replacing=true; location.replace(h); }
let prev={root:null,a:null};
// Where back goes when there is no earlier in-app page (e.g. a link opened directly).
function parentOf(hash){
  const [root,a,b]=hash.replace(/^#\/?/,'').split('/');
  if(root==='submit') return '#/campaign/'+(a||'uber');
  if(root==='campaign') return (b||(C[a]&&C[a].status))?'#/mywork':'#/explore';
  if(root==='settings') return '#/profile';
  return '#/explore';
}
function goBack(fallback){
  if(navIdx>0) history.back();
  else replaceHash(fallback||parentOf(location.hash));
}
function route(){
  const h=location.hash.replace(/^#\/?/,'')||'explore';
  const [root,a,b]=h.split('/');
  const known=['view','campaign','mywork','wallet','profile','settings','submit','notifications'];
  const r=known.includes(root)?root:'explore';
  const tabSwitch=r==='mywork'&&prev.root==='mywork'&&(a||'all')!==(prev.a||'all');
  let html,title='Campaigns';
  if(r==='campaign'){html=viewCampaign(a,b);title=(C[a]||{}).title||'Campaign';}
  else if(r==='view'){html=viewCampaign(a,null,{solo:true});title=(C[a]||{}).title||'Campaign';}
  else if(r==='mywork'){html=viewMyWork(a);title='My work';}
  else if(r==='wallet'){html=viewWallet();title='My wallet';}
  else if(r==='profile'){html=viewProfile();title='My profile';}
  else if(r==='settings'){html=viewSettings();title='Account settings';}
  else if(r==='submit'){html=viewSubmit(a);title='Submit content';}
  else if(r==='notifications'){html=viewNotifications();title='Notifications';}
  else html=viewExplore();
  view.innerHTML=html;
  document.body.classList.toggle('wide',r==='campaign');
  bindAssets(view);
  if(tabSwitch) staggerMyWork();
  else {view.classList.remove('nav-in');void view.offsetWidth;view.classList.add('nav-in');window.scrollTo({top:0,behavior:'instant'});}
  renderFeed();
  if(r==='explore'&&state.searchOpen) setSearch(true); else document.getElementById('search-btn').classList.remove('on');
  if(r!=='explore') state.searchOpen=false;
  document.title=title+' — UGC Platform';
  const navRoot=r==='view'?'explore':r==='campaign'?(b||(C[a]&&C[a].status)?'mywork':'explore'):r==='submit'?'explore':r;
  document.querySelectorAll('#tnav a').forEach(n=>n.classList.toggle('active',n.dataset.root===navRoot));
  document.querySelectorAll('#drawer a').forEach(n=>n.classList.toggle('active',n.dataset.root===navRoot));
  const bell=document.getElementById('bell-btn');bell.classList.toggle('on',r==='notifications');
  if(r==='notifications'){bell.setAttribute('aria-current','page');document.getElementById('bell-dot')?.remove();}else bell.removeAttribute('aria-current');
  setDrawer(false);
  const st=history.state;
  if(st&&typeof st.i==='number') navIdx=st.i;
  else{if(!replacing) navIdx++; replacing=false; history.replaceState({i:navIdx},'');}
  prev={root:r,a};
  closeCampaignDrawer();
  closeOverlay();
}
window.addEventListener('hashchange',route);

/* My work tag switch: tag pop + staggered 3D reveal, as on mobile */
function staggerMyWork(){
  const t=view.querySelector('.mw-tags .tag.active'); if(t) t.classList.add('tag-pop');
  [...view.querySelectorAll('.sechead,.mw-logo72,.mw-card,.mw-chip,.cardwrap')].forEach((el,i)=>{
    el.style.animationDelay=Math.min(i*55,440)+'ms'; el.classList.add('mw-stagger');
    el.addEventListener('animationend',()=>{el.classList.remove('mw-stagger');el.style.animationDelay='';},{once:true});
  });
}

const SHEETS={
  logout:()=>`<div class="cf-sheet"><div class="cf-ic neutral">${MICON.sheetLogout}</div><div class="cf-text"><h3>Log out?</h3><p>You'll need to sign back in to access your campaigns and wallet.</p></div>
    <div class="cf-actions"><div class="cf-btn dark" data-close data-go="#/explore">Log out</div><div class="cf-btn ghost" data-close>Cancel</div></div></div>`,
  delete:()=>`<div class="cf-sheet"><div class="cf-ic warn">${MICON.sheetWarn}</div><div class="cf-text"><h3>Delete account permanently?</h3><p>This can't be undone. Your profile, content and campaign history will be removed for good.</p></div>
    <div class="cf-actions"><div class="cf-btn danger" data-close data-go="#/explore">Delete permanently</div><div class="cf-btn ghost" data-close>Cancel</div></div></div>`,
  transfer:()=>`<div class="cf-sheet"><div class="cf-ic neutral">${MICON.bank}</div><div class="cf-text"><h3>Transfer Rs. 12,688?</h3><p>Your available balance will be sent to the bank account on your profile.</p></div>
    <div class="cf-actions"><div class="cf-btn dark" data-close data-toast="Transfer started">Transfer</div><div class="cf-btn ghost" data-close>Cancel</div></div></div>`,
  submitted:()=>`<div class="ov-sheet"><div class="ov-graphic"><img class="thumb t1" data-a="grid2" data-label="C" alt=""><img class="thumb t2" data-a="grid1" data-label="C" alt=""><div class="glow"></div><div class="label">On the<br>Table</div></div>
    <div class="ov-text"><div class="ov-title">Superb machan,<br>Your content was <span class="purple">submitted for approval</span></div><div class="ov-primary" data-close data-go="#/explore">Got it</div></div></div>`,
};

/* ================= Interactions ================= */
const toastEl=document.getElementById('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2200);}
/* Phone menu: a panel that slides in from the left under the top bar */
const drawer=document.getElementById('drawer');
function setDrawer(open){
  drawer.classList.toggle('open',open);drawer.setAttribute('aria-hidden',!open);
  drawer.querySelectorAll('a').forEach(a=>a.tabIndex=open?0:-1);
  const b=document.getElementById('menu-btn');b.classList.toggle('on',open);b.setAttribute('aria-expanded',open);
  document.body.classList.toggle('drawer-open',open);
}
function viewNotifications(){
  const text=n=>n.type==='approved'?`<b>${n.brand} campaign</b><span class="med"> got approved</span>`
    :n.type==='reply'?`<span class="med">Check out the </span><b>reply from ${n.brand}</b>`
    :`<b>+ Rs. ${n.amount}</b><span class="med"> from </span><b>${n.brand}</b><span class="med">, ${n.detail}</span>`;
  return `<div class="notifs"><div class="page-title">Notifications</div>
    <div class="nt-list">${notifications.map(n=>`<div class="nt-item"><img class="nt-logo" data-a="${n.logo}" alt=""><div class="nt-body"><p class="nt-text">${text(n)}</p><span class="nt-time">${n.time}</span></div></div>`).join('')}</div></div>`;
}

document.addEventListener('click',e=>{
  const t=e.target;
  const heart=t.closest('.like-heart');
  if(heart){e.preventDefault();e.stopPropagation();heart.classList.toggle('liked');return;}
  if(t.closest('[data-search]')){e.preventDefault();toggleSearch();return;}
  if(t.closest('[data-cdrawer-close]')){e.preventDefault();closeCampaignDrawer();return;}
  const cd=t.closest('[data-cdrawer]');
  // Phones keep the full campaign page; the drawer is for wider screens only
  if(cd){if(matchMedia('(max-width:767px)').matches) location.hash=`#/campaign/${cd.dataset.cdrawer}`; else openCampaignDrawer(cd.dataset.cdrawer);return;}
  if(t.closest('#menu-btn')){e.preventDefault();setDrawer(!drawer.classList.contains('open'));return;}
  if(t.closest('#drawer a')||t.id==='drawer-scrim') setDrawer(false);
  const cl=t.closest('[data-close]');
  if(cl){closeOverlay();if(cl.dataset.toast)toast(cl.dataset.toast);if(cl.dataset.go)replaceHash(cl.dataset.go);return;}
  const cat=t.closest('[data-cat]');
  if(cat){state.cat=cat.dataset.cat;document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c===cat));renderFeed();return;}
  const tg=t.closest('[data-tg]');
  if(tg){tg.querySelector('.tg').classList.toggle('on');return;}
  const chk=t.closest('[data-check]');
  if(chk){chk.classList.toggle('on');chk.classList.remove('bad');return;}
  const sc=t.closest('[data-scroll]');
  if(sc){document.getElementById(sc.dataset.scroll).scrollIntoView({behavior:'smooth',block:'start'});return;}
  const bk=t.closest('[data-back]');
  if(bk){e.preventDefault();goBack(bk.dataset.back);return;}
  const act=t.closest('[data-act]');
  if(act){e.preventDefault();return doAct(act.dataset.act,act);}
  const go=t.closest('[data-go]');
  if(go&&!t.closest('a[href]')){location.hash=go.dataset.go;}
});
function doAct(a,el){
  if(a==='soon') return toast('This screen is next to build');
  if(a==='share') return toast('Link copied');
  if(a==='clear'){state.cat='All';state.q='';const qi=document.getElementById('q');if(qi)qi.value='';document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c.dataset.cat==='All'));return renderFeed();}
  if(a==='upload') return document.getElementById('file').click();
  if(SHEETS[a]) return openOverlay(SHEETS[a]());
}

/* Upload */
function setUpload(name,size){
  state.upload=name;const d=document.getElementById('drop');if(!d) return;
  d.classList.add('has');document.getElementById('drop-t').textContent=name;
  document.getElementById('drop-s').textContent=(size/1048576).toFixed(1)+' MB · click to replace';
}
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)setUpload(f.name,f.size);e.target.value='';});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)setUpload(f.name,f.size);}});

/* Submit validation: at least one valid post link + terms accepted */
document.addEventListener('submit',e=>{
  if(e.target.id!=='sform') return; e.preventDefault();
  const inputs=[...document.querySelectorAll('.sc-linkinput')];
  let filled=0,anyBad=false;
  inputs.forEach(i=>{const v=i.value.trim(),bad=!!v&&!LINKRE[i.dataset.plat].test(v);if(v)filled++;anyBad=anyBad||bad;document.getElementById('g-'+i.dataset.plat).classList.toggle('bad',bad);});
  const none=!filled; document.getElementById('g-links').classList.toggle('none',none);
  const terms=document.getElementById('terms'),tOk=terms.classList.contains('on');terms.classList.toggle('bad',!tOk);
  const msg=document.getElementById('form-msg');
  if(none||anyBad||!tOk){msg.textContent=none?'Add at least one post link to continue':anyBad?'Fix the highlighted link to continue':'Please accept the Terms & Conditions';return;}
  msg.textContent='';
  const btn=document.getElementById('sbtn');btn.disabled=true;btn.textContent='Submitting…';
  setTimeout(()=>{btn.disabled=false;btn.textContent='Submit for approval';openOverlay(SHEETS.submitted());},900);
});
const LINKRE={tiktok:/^https?:\/\/(www\.|vm\.|m\.)?tiktok\.com\/\S+/i,insta:/^https?:\/\/(www\.)?instagram\.com\/\S+/i,
  youtube:/^https?:\/\/((www\.|m\.)?youtube\.com|youtu\.be)\/\S+/i,facebook:/^https?:\/\/((www\.|m\.|web\.)?facebook\.com|fb\.watch)\/\S+/i,linkedin:/^https?:\/\/(www\.)?linkedin\.com\/\S+/i};
document.addEventListener('input',e=>{const g=e.target.closest('.sc-linkgroup');if(g){g.classList.remove('bad');document.getElementById('g-links').classList.remove('none');}});

/* Search filters the campaign feed */
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;renderFeed();}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(state.searchOpen&&document.getElementById('q'))document.getElementById('q').focus();else toggleSearch();}
  if(e.key==='Escape'){if(state.searchOpen&&document.activeElement.id==='q'){setSearch(false);document.getElementById('search-btn').focus();}if(overlay.classList.contains('open'))closeOverlay();else closeCampaignDrawer();setDrawer(false);}
});

/* ===== Init ===== */
renderTopNav();
bindAssets(document.body);
route();
</script>
